<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S032 — DEBRIS FIELD</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// The numbers on the rocks are what the lineage called its works. Break them up before they break you.
let ship,bullets=[],rocks=[],parts=[],wave=1,score=0,lives=3,cool=0,invuln=0,best=0;
const wrap=(o,K,m=0)=>{if(o.x<-m)o.x+=K.w+2*m;if(o.x>K.w+m)o.x-=K.w+2*m;if(o.y<-m)o.y+=K.h+2*m;if(o.y>K.h+m)o.y-=K.h+2*m};
function mk(K,x,y,r){const a=K.rand()*K.TAU,v=30+K.rand()*50;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r,rot:K.rand()*K.TAU,vr:(K.rand()-.5)*1.2,sh:Array.from({length:9},()=>.75+K.rand()*.5),ch:String(Math.floor(K.rand()*10))}}
function spawnWave(K){rocks=[];for(let i=0;i<2+wave;i++){let x,y;do{x=K.rand()*K.w;y=K.rand()*K.h}while(Math.hypot(x-ship.x,y-ship.y)<180);rocks.push(mk(K,x,y,38))}}
function boom(K,x,y,n,c){for(let i=0;i<n;i++){const a=K.rand()*K.TAU,v=40+K.rand()*160;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,c})}}
Salvage({id:'S032',title:'DEBRIS FIELD',parent:'024 FOSSIL INDEX',
 help:'<kbd>←</kbd><kbd>→</kbd> ROTATE &nbsp;<kbd>↑</kbd> THRUST &nbsp;<kbd>SPACE</kbd> FIRE<br>THE POINTER IS A GRAVITY WELL FOR THE ROCKS / HOLD TO PULL HARD',
 aria:'An asteroids-style game. Left and right rotate a small ship, Up thrusts and Space fires. Rocks marked with numbers split into smaller rocks when shot. Colliding costs a life. The pointer is a gravity well that attracts the rocks; holding it pulls harder.',
 reset(K){ship={x:K.w/2,y:K.h/2,vx:0,vy:0,a:-Math.PI/2};wave=1;score=0;lives=3;invuln=2.5;bullets=[];parts=[];cool=0;spawnWave(K)},
 key(K,e,fresh){if(e.code==='Space'||/^Arrow|^Key[WASD]$/.test(e.code))return true},
 step(K,dt){
  const dir=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0);
  ship.a+=dir*3.4*dt;if(K.keys.has('ArrowUp')||K.keys.has('KeyW')){ship.vx+=Math.cos(ship.a)*260*dt;ship.vy+=Math.sin(ship.a)*260*dt}
  const f=Math.exp(-dt*.25);ship.vx*=f;ship.vy*=f;const sp=Math.hypot(ship.vx,ship.vy);if(sp>420){ship.vx*=420/sp;ship.vy*=420/sp}
  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship,K,10);cool-=dt;invuln=Math.max(0,invuln-dt);
  if(K.keys.has('Space')&&cool<=0){cool=.22;bullets.push({x:ship.x+Math.cos(ship.a)*12,y:ship.y+Math.sin(ship.a)*12,vx:Math.cos(ship.a)*560+ship.vx,vy:Math.sin(ship.a)*560+ship.vy,t:0})}
  const p=K.pointer;
  for(const r of rocks){
   if(p.inside){const dx=p.x-r.x,dy=p.y-r.y,d=Math.hypot(dx,dy)+1;if(d<300){const q=1-d/300,g=(p.held?520:130)*q;r.vx+=dx/d*g*dt;r.vy+=dy/d*g*dt}}
   const s=Math.hypot(r.vx,r.vy);if(s>170){r.vx*=170/s;r.vy*=170/s}
   r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;wrap(r,K,r.r);
  }
  for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;wrap(b,K);let hit=false;
   for(let j=rocks.length-1;j>=0&&!hit;j--){const r=rocks[j];if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){hit=true;rocks.splice(j,1);score+=r.r>30?20:r.r>18?50:100;boom(K,r.x,r.y,8,K.DAMAGE[+r.ch%6]);if(r.r>14){for(let k=0;k<2;k++){const n=mk(K,r.x,r.y,r.r*.6);n.vx+=r.vx*.5;n.vy+=r.vy*.5;rocks.push(n)}}}}
   if(hit||b.t>1.1)bullets.splice(i,1);
  }
  if(!invuln)for(const r of rocks)if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r*.85+7){lives--;boom(K,ship.x,ship.y,24,'#faffdb');ship.x=K.w/2;ship.y=K.h/2;ship.vx=ship.vy=0;invuln=2.5;if(lives<0){best=Math.max(best,score);K.note('SIGNAL LOST / SCORE '+score);wave=1;score=0;lives=3;bullets=[];spawnWave(K)}break}
  if(!rocks.length){wave++;K.note('WAVE '+K.pad(wave,2));invuln=2;spawnWave(K)}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.t>1)parts.splice(i,1)}
  best=Math.max(best,score);
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  for(const r of rocks){c.strokeStyle=K.DAMAGE[+r.ch%6];c.lineWidth=1.4;c.beginPath();r.sh.forEach((m,i)=>{const a=r.rot+i/9*TAU,x=r.x+Math.cos(a)*r.r*m,y=r.y+Math.sin(a)*r.r*m;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.stroke();c.fillStyle=c.strokeStyle;c.font=Math.round(r.r*.7)+'px monospace';c.textAlign='center';c.fillText(r.ch,r.x,r.y+r.r*.25)}
  c.textAlign='left';c.lineWidth=1;c.fillStyle='#faffdb';for(const b of bullets)c.fillRect(b.x-1.5,b.y-1.5,3,3);
  for(const q of parts){c.globalAlpha=1-q.t;c.fillStyle=q.c;c.fillRect(q.x-1.5,q.y-1.5,3,3)}c.globalAlpha=1;
  if(!invuln||Math.floor(K.time*10)%2){c.save();c.translate(ship.x,ship.y);c.rotate(ship.a);c.strokeStyle='#faffdb';c.lineWidth=1.6;c.beginPath();c.moveTo(12,0);c.lineTo(-9,7);c.lineTo(-5,0);c.lineTo(-9,-7);c.closePath();c.stroke();if(K.keys.has('ArrowUp')||K.keys.has('KeyW')){c.strokeStyle='#fe6741';c.beginPath();c.moveTo(-6,3);c.lineTo(-14-Math.random()*6,0);c.lineTo(-6,-3);c.stroke()}c.restore();c.lineWidth=1}
  c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('♦'.repeat(Math.max(0,lives)),w/2-20,h-54);
  if(p.inside){c.globalAlpha=.4;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,300,0,TAU);c.stroke();c.globalAlpha=1;c.fillText(p.held?'PULLING':'WELL',p.x+8,p.y-8)}
 },
 readout:K=>['SCORE '+K.pad(score,5),'WAVE '+K.pad(wave,2)+' / LIVES '+Math.max(0,lives)+' / BEST '+K.pad(best,5)]
});
})();
</script></body></html>
