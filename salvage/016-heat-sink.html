<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a1a"><title>S016 — HEAT SINK</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A hot cell is not an event. A neighbour of a hot cell is.
const CELL=13,ramp=[[0,[5,10,26]],[.25,[43,26,110]],[.5,[176,26,138]],[.72,[254,103,65]],[.9,[255,240,160]],[1,[255,255,255]]];
const color=t=>{for(let k=1;k<ramp.length;k++)if(t<=ramp[k][0]){const [a,A]=ramp[k-1],[b,B]=ramp[k],u=(t-a)/(b-a);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*u)).join(',')+')'}return'#fff'};
const pal=Array.from({length:48},(_,i)=>color(i/47));
let cols=0,rows=0,T=null,N2=null,slag=null,probe={x:0,y:0,vx:0,vy:0},cool=0,pulse=0,pulseAt={x:0,y:0},slagged=0,seedT=0,peak=0,mean=0,lastNote=-9;
const idx=(i,j)=>j*cols+i;
function touch(x,y,r,amt){const ci=x/CELL,cj=y/CELL,rc=r/CELL;for(let j=Math.max(0,Math.floor(cj-rc));j<=Math.min(rows-1,Math.ceil(cj+rc));j++)for(let i=Math.max(0,Math.floor(ci-rc));i<=Math.min(cols-1,Math.ceil(ci+rc));i++){const d=Math.hypot(i+.5-ci,j+.5-cj);if(d<rc){const n=idx(i,j);if(!slag[n])T[n]=Math.max(0,Math.min(.99,T[n]+amt*(1-d/rc)))}}}
function hot(K){const x=K.rand()*K.w,y=K.rand()*K.h;touch(x,y,CELL*2.6,.5)}
function init(K){cols=Math.ceil(K.w/CELL);rows=Math.ceil(K.h/CELL);T=new Float32Array(cols*rows);N2=new Float32Array(cols*rows);slag=new Uint8Array(cols*rows);for(let n=0;n<T.length;n++)T[n]=.05+K.noise(n%cols*.15,Math.floor(n/cols)*.15)*.12;probe={x:K.w/2,y:K.h/2,vx:0,vy:0};cool=pulse=0;slagged=0;seedT=0;lastNote=-9;for(let k=0;k<3;k++)hot(K)}
Salvage({id:'S016',title:'HEAT SINK',parent:'013 THERMAL RUNAWAY',bg:'#050a1a',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE THE COOLING PROBE &nbsp;<kbd>SPACE</kbd> COOLANT PULSE<br>THE POINTER READS TEMPERATURE / HOLD TO SOLDER (HEAT)',
 aria:'A thermal map of a chip as a grid of cells glowing from dark blue to white. Hot spots appear and run away on their own. Arrow keys move a cooling probe; Space releases a larger coolant pulse. Cells that reach the limit burn out permanently. The pointer shows the temperature beneath it; holding it adds heat.',
 reset(K){init(K)},
 resize(K){init(K)},
 key(K,e,fresh){if(e.code==='Space'){if(fresh&&cool<=0){touch(probe.x,probe.y,150,-.6);pulse=.6;pulseAt={x:probe.x,y:probe.y};cool=5}return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 step(K,dt){
  const ax=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),ay=(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0)-(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0);
  probe.vx+=ax*1500*dt;probe.vy+=ay*1500*dt;const f=Math.exp(-dt*6);probe.vx*=f;probe.vy*=f;
  probe.x=K.clamp(probe.x+probe.vx*dt,0,K.w);probe.y=K.clamp(probe.y+probe.vy*dt,0,K.h);
  cool=Math.max(0,cool-dt);pulse=Math.max(0,pulse-dt);
  touch(probe.x,probe.y,42,-dt*2.2);
  const p=K.pointer;if(p.inside&&p.held)touch(p.x,p.y,34,dt*1.5);
  seedT-=dt;if(seedT<=0){hot(K);seedT=Math.max(1.1,3.6-K.time*.012)}
  const k=Math.min(.9,dt*9);let sum=0,pk=0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
   const n=idx(i,j);if(slag[n]){N2[n]=.3;continue}
   let s=0,c=0;if(i>0){s+=T[n-1];c++}if(i<cols-1){s+=T[n+1];c++}if(j>0){s+=T[n-cols];c++}if(j<rows-1){s+=T[n+cols];c++}
   let v=T[n]+k*(s/c-T[n]);v+=dt*(.006+2.4*Math.max(0,v-.32)*v);v-=dt*.04*v;
   if(v>=1){slag[n]=1;slagged++;v=.3;if(K.time-lastNote>2.2){lastNote=K.time;K.note('CELL LOST / SLAG '+K.pad(slagged))}}
   N2[n]=v;sum+=v;if(v>pk)pk=v;
  }
  const t=T;T=N2;N2=t;mean=sum/T.length;peak=pk;
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#050a1a';c.fillRect(0,0,w,h);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const n=idx(i,j);if(slag[n]){c.fillStyle='#0c0a09';c.fillRect(i*CELL,j*CELL,CELL,CELL);c.fillStyle='#2b241f';c.fillRect(i*CELL+4,j*CELL+4,3,3)}else{c.fillStyle=pal[Math.min(47,Math.floor(T[n]*47))];c.fillRect(i*CELL,j*CELL,CELL+.5,CELL+.5)}}
  c.strokeStyle='#faffdb';c.lineWidth=1.2;c.beginPath();c.arc(probe.x,probe.y,42,0,TAU);c.moveTo(probe.x-10,probe.y);c.lineTo(probe.x+10,probe.y);c.moveTo(probe.x,probe.y-10);c.lineTo(probe.x,probe.y+10);c.stroke();
  c.globalAlpha=.6;c.beginPath();c.arc(probe.x,probe.y,50,-Math.PI/2,-Math.PI/2+TAU*(1-cool/5));c.stroke();c.lineWidth=1;
  if(pulse>0){c.globalAlpha=pulse/.6;c.strokeStyle='#b7f6ff';c.beginPath();c.arc(pulseAt.x,pulseAt.y,(1-pulse/.6)*150,0,TAU);c.stroke()}
  c.globalAlpha=1;c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('PROBE'+(cool<=0?' / PULSE READY':''),probe.x+50,probe.y-10);
  if(p.inside){const n=idx(K.clamp(Math.floor(p.x/CELL),0,cols-1),K.clamp(Math.floor(p.y/CELL),0,rows-1));c.globalAlpha=.7;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,70,0,TAU);c.stroke();c.globalAlpha=1;c.fillText(slag[n]?'SLAG':(20+T[n]*980).toFixed(0)+'°C'+(p.held?' / SOLDERING':''),p.x+76,p.y)}
 },
 readout:K=>['PEAK '+Math.round(20+peak*980)+'°C','SLAG '+K.pad(slagged)+' / MEAN '+Math.round(20+mean*980)+'°']
});
})();
</script></body></html>
