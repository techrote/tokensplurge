<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b"><title>S059 — SALVO</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Light the numbered beacons in the dark with shells. Overlapping bursts chain.
const TYPES=['PEONY','RING','WILLOW','CRACKLE'];
let shells=[],parts=[],beacons=[],lx=0,power=0,charging=false,pdir=1,type=0,score=0,lit=0,shots=0,combo=0,comboT=0,lastBurst=null,best=0,flashes=[],wind=0;
function newBeacons(K){beacons=Array.from({length:6},(_,i)=>({x:K.w*(.12+K.rand()*.76),y:K.h*(.12+K.rand()*.4),on:0,n:String(Math.floor(K.rand()*100)).padStart(2,'0')}))}
function burst(K,x,y,t,col){
 const n=t===1?64:t===0?90:t===2?70:110;
 for(let i=0;i<n;i++){let a=K.rand()*K.TAU,v=60+K.rand()*(t===0?170:90);if(t===1){a=i/n*K.TAU;v=150}if(t===3){v=40+K.rand()*220}
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:t===2?2.6:t===3?.9:1.6,c:col||K.DAMAGE[Math.floor(K.rand()*6)],tr:t===2,g:t===2?110:90})}
 flashes.push({x,y,t:0,c:col});
 if(lastBurst&&K.time-lastBurst.t<1.3&&Math.hypot(lastBurst.x-x,lastBurst.y-y)<260){combo++;comboT=2;if(combo>=2)K.note('CHAIN ×'+combo)}else combo=1;
 lastBurst={x,y,t:K.time};best=Math.max(best,combo);score+=50*combo;
}
Salvage({id:'S059',title:'SALVO',parent:'020 PHOSPHOR BLOOM',bg:'#03050b',
 help:'<kbd>←</kbd><kbd>→</kbd> MOVE THE MORTAR &nbsp;HOLD <kbd>SPACE</kbd> TO CHARGE, RELEASE TO LAUNCH &nbsp;<kbd>↑</kbd><kbd>↓</kbd> SHELL TYPE<br>LIGHT EVERY NUMBERED BEACON / THE POINTER BLOWS WIND ACROSS THE SKY',
 aria:'A fireworks game. Left and right arrows move a mortar at the bottom, holding Space charges a shell and releasing it launches it to burst at its peak, and up and down choose the shell type. Sparks that pass near a numbered beacon light it. Bursts close together in time and place chain for more points. The pointer position blows wind that pushes the sparks sideways.',
 reset(K){shells=[];parts=[];lx=K.w/2;power=0;charging=false;type=0;score=lit=shots=combo=best=0;lastBurst=null;flashes=[];newBeacons(K)},
 key(K,e,fresh){
  if(e.code==='Space'){if(fresh){charging=true;power=0;pdir=1}return true}
  if(fresh&&(e.code==='ArrowUp'||e.code==='KeyW')){type=(type+1)%TYPES.length;return true}
  if(fresh&&(e.code==='ArrowDown'||e.code==='KeyS')){type=(type+TYPES.length-1)%TYPES.length;return true}
  if(/^Arrow|^Key[AD]$/.test(e.code))return true;
 },
 keyup(K,e){if(e.code==='Space'&&charging){charging=false;shots++;shells.push({x:lx,y:K.h-50,vx:0,vy:-(280+power*460),c:K.DAMAGE[Math.floor(K.rand()*6)],t:type,trail:[]});power=0}},
 step(K,dt){
  const d=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0);lx=K.clamp(lx+d*420*dt,30,K.w-30);
  if(charging){power+=pdir*dt*.9;if(power>=1){power=1;pdir=-1}if(power<=0){power=0;pdir=1}}
  const p=K.pointer;wind=p.inside?(p.x/K.w-.5)*220:0;comboT=Math.max(0,comboT-dt);if(!comboT)combo=Math.min(combo,1);
  for(let i=shells.length-1;i>=0;i--){const s=shells[i];s.vy+=520*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.trail.push([s.x,s.y]);if(s.trail.length>14)s.trail.shift();if(s.vy>=0){burst(K,s.x,s.y,s.t,s.c);shells.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.vy+=q.g*dt;q.vx+=wind*dt*.6;q.vx*=Math.exp(-dt*.9);q.vy*=Math.exp(-dt*.5);q.x+=q.vx*dt;q.y+=q.vy*dt;
   for(const b of beacons)if(!b.on&&Math.hypot(q.x-b.x,q.y-b.y)<16){b.on=1;lit++;score+=100*Math.max(1,combo);K.note('BEACON '+b.n+' LIT')}
   if(q.t>q.life)parts.splice(i,1)}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=dt;if(flashes[i].t>.4)flashes.splice(i,1)}
  for(const b of beacons)b.on=b.on>0?Math.min(2.5,b.on+dt*.0)+0:0;
  if(beacons.every(b=>b.on)){setTimeout(()=>{},0);beacons=[];newBeacons(K);K.note('SKY CLEARED / NEW BEACONS')}
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;const bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#02030a');bg.addColorStop(1,'#0b1226');c.fillStyle=bg;c.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){c.globalAlpha=.2+K.hash(i)*.4;c.fillStyle='#b7f6ff';c.fillRect(K.hash(i*3.1)*w,K.hash(i*7.7)*h*.8,1.3,1.3)}c.globalAlpha=1;
  for(const f of flashes){c.globalAlpha=(1-f.t/.4)*.25;c.fillStyle='#fff';c.beginPath();c.arc(f.x,f.y,40+f.t*200,0,TAU);c.fill()}c.globalAlpha=1;
  for(const b of beacons){c.strokeStyle=b.on?'#f4d84e':'#2a3d5e';c.fillStyle=b.on?'#f4d84e':'#4f6b80';c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,12,0,TAU);c.stroke();c.lineWidth=1;c.font='9px monospace';c.textAlign='center';c.fillText(b.n,b.x,b.y+3);c.textAlign='left';if(b.on){c.globalAlpha=.3;c.beginPath();c.arc(b.x,b.y,16+Math.sin(K.time*6)*3,0,TAU);c.fill();c.globalAlpha=1}}
  c.globalCompositeOperation='lighter';for(const q of parts){const a=1-q.t/q.life;c.globalAlpha=a;c.fillStyle=q.c;c.fillRect(q.x-1.5,q.y-1.5,3,3);if(q.tr){c.globalAlpha=a*.4;c.fillRect(q.x-q.vx*.04,q.y-q.vy*.04,2,2)}}c.globalAlpha=1;c.globalCompositeOperation='source-over';
  for(const s of shells){s.trail.forEach(([x,y],k)=>{c.globalAlpha=k/14*.6;c.fillStyle='#faffdb';c.fillRect(x-1,y-1,2,2)});c.globalAlpha=1;c.fillStyle='#fff';c.fillRect(s.x-2,s.y-2,4,4)}
  c.strokeStyle='#faffdb';c.lineWidth=3;c.beginPath();c.moveTo(lx,h-40);c.lineTo(lx,h-58);c.stroke();c.lineWidth=1;c.fillStyle='#ffffff22';c.fillRect(lx-30,h-34,60,4);c.fillStyle=power>.85?'#ed4e8c':'#faffdb';c.fillRect(lx-30,h-34,60*power,4);
  c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('SHELL: '+TYPES[type]+(combo>1?' / CHAIN ×'+combo:''),lx-30,h-20);
  if(p.inside){c.globalAlpha=.6;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+wind*.4,p.y);c.stroke();c.globalAlpha=1;c.fillText('WIND '+(wind>=0?'→':'←')+Math.abs(wind).toFixed(0),p.x+8,p.y-8)}
 },
 readout:K=>['SCORE '+K.pad(score,6),'LIT '+beacons.filter(b=>b.on).length+'/'+beacons.length+' / BEST CHAIN ×'+best]
});
})();
</script></body></html>
