<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S050 — CACHE</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Push every block onto a marked address. Each room is built by running a solution backwards, so every one can be solved.
let W=8,H=6,wall=null,boxes=null,targets=null,me={x:0,y:0},hist=[],moves=0,level=0,wins=0,cell=40,ox=0,oy=0,path=[],pathT=0,solved=0;
const id=(x,y)=>y*W+x,free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!wall[id(x,y)];
function gen(K){
 W=Math.min(12,7+Math.floor(level/2));H=Math.min(9,5+Math.floor(level/2));cell=Math.min(K.w*.86/W,K.h*.7/H,70);ox=(K.w-cell*W)/2;oy=(K.h-cell*H)/2+8;
 for(let tries=0;tries<80;tries++){
  wall=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||y===0||x===W-1||y===H-1||K.rand()<.1)wall[id(x,y)]=1;
  const cells=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!wall[id(x,y)])cells.push([x,y]);const nb=Math.min(2+Math.floor(level/2),5);if(cells.length<nb+6)continue;
  cells.sort(()=>K.rand()-.5);targets=new Set(cells.slice(0,nb).map(([x,y])=>id(x,y)));boxes=new Set(targets);const [px,py]=cells[nb];me={x:px,y:py};
  for(let s=0;s<80+level*20;s++){const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(K.rand()*4)],nx=me.x+d[0],ny=me.y+d[1];if(!free(nx,ny)||boxes.has(id(nx,ny)))continue;
   const bx=me.x-d[0],by=me.y-d[1];if(K.rand()<.55&&boxes.has(id(bx,by))){boxes.delete(id(bx,by));boxes.add(id(me.x,me.y))}me={x:nx,y:ny}}
  let same=true;for(const b of boxes)if(!targets.has(b))same=false;if(!same)break;
 }
 hist=[];moves=0;path=[];solved=0;
}
function push(K,dx,dy){
 if(solved)return false;const nx=me.x+dx,ny=me.y+dy;if(!free(nx,ny))return false;
 if(boxes.has(id(nx,ny))){const bx=nx+dx,by=ny+dy;if(!free(bx,by)||boxes.has(id(bx,by)))return false;hist.push({me:{...me},boxes:new Set(boxes)});boxes.delete(id(nx,ny));boxes.add(id(bx,by))}else hist.push({me:{...me},boxes:new Set(boxes)});
 me={x:nx,y:ny};moves++;if([...boxes].every(b=>targets.has(b))){wins++;solved=.001;K.note('CACHED / ROOM '+K.pad(wins)+' / IT WILL BE EVICTED')}return true;
}
function bfs(tx,ty){const prev=new Map(),q=[[me.x,me.y]];prev.set(id(me.x,me.y),null);while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=id(nx,ny);if(free(nx,ny)&&!boxes.has(k)&&!prev.has(k)){prev.set(k,[x,y,dx,dy]);q.push([nx,ny])}}}
 if(!prev.has(id(tx,ty)))return[];const out=[];let k=id(tx,ty);while(prev.get(k)){const [x,y,dx,dy]=prev.get(k);out.unshift([dx,dy]);k=id(x,y)}return out}
const KD={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
Salvage({id:'S050',title:'CACHE',parent:'041 INTERMITTENT PICTURE',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> WALK AND PUSH &nbsp;<kbd>Z</kbd> UNDO<br>PUT EVERY BLOCK ON A MARKED ADDRESS / CLICK A CELL TO WALK THERE',
 aria:'A box-pushing puzzle. Arrow keys move a small figure and push blocks; every block must end on a marked target. Z undoes a move. Rooms are generated by working backward from a solved state, so each is solvable. Clicking an empty cell makes the figure walk there by the shortest path that does not push anything.',
 reset(K){level=0;wins=0;gen(K)},
 resize(K){cell=Math.min(K.w*.86/W,K.h*.7/H,70);ox=(K.w-cell*W)/2;oy=(K.h-cell*H)/2+8},
 key(K,e,fresh){
  if(e.code==='KeyZ'||e.code==='Backspace'){if(fresh&&hist.length&&!solved){const s=hist.pop();me=s.me;boxes=s.boxes;moves=Math.max(0,moves-1)}return true}
  const d=KD[e.code];if(d){if(fresh){path=[];push(K,d[0],d[1])}return true}
 },
 down(K,x,y){const cx=Math.floor((x-ox)/cell),cy=Math.floor((y-oy)/cell);if(cx<0||cy<0||cx>=W||cy>=H)return false;path=bfs(cx,cy);return true},
 step(K,dt){
  if(path.length){pathT-=dt;if(pathT<=0){pathT=.07;const [dx,dy]=path.shift();if(!push(K,dx,dy))path=[]}}
  if(solved){solved+=dt;if(solved>2){level++;gen(K)}}
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  const hv=p.inside?[Math.floor((p.x-ox)/cell),Math.floor((p.y-oy)/cell)]:null;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=id(x,y),px=ox+x*cell,py=oy+y*cell;
   if(wall[i]){c.fillStyle='#1b2a4a';c.fillRect(px,py,cell-1,cell-1);c.strokeStyle='#2a3d5e';c.strokeRect(px+.5,py+.5,cell-2,cell-2);continue}
   c.fillStyle='#0a131e';c.fillRect(px,py,cell-1,cell-1);if(targets.has(i)){c.strokeStyle='#f4d84e';c.lineWidth=2;c.beginPath();c.arc(px+cell/2,py+cell/2,cell*.22,0,TAU);c.stroke();c.lineWidth=1}
   if(hv&&hv[0]===x&&hv[1]===y&&!boxes.has(i)){c.strokeStyle='#ed4e8c';c.strokeRect(px+2,py+2,cell-5,cell-5)}
   if(boxes.has(i)){const on=targets.has(i);c.fillStyle=on?'#10f4cf':'#c98a4b';c.fillRect(px+4,py+4,cell-9,cell-9);c.strokeStyle='#05070e';c.strokeRect(px+7.5,py+7.5,cell-15,cell-15);c.beginPath();c.moveTo(px+7,py+7);c.lineTo(px+cell-8,py+cell-8);c.moveTo(px+cell-8,py+7);c.lineTo(px+7,py+cell-8);c.stroke()}}
  c.fillStyle='#faffdb';c.beginPath();c.arc(ox+(me.x+.5)*cell,oy+(me.y+.5)*cell,cell*.28,0,TAU);c.fill();c.fillStyle='#05070e';c.fillRect(ox+(me.x+.5)*cell-4,oy+(me.y+.5)*cell-4,3,3);
  c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText(W+'×'+H+' / '+[...boxes].filter(b=>targets.has(b)).length+'/'+targets.size+' CACHED',ox,oy-12);
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.strokeRect(ox-6,oy-6,cell*W+12,cell*H+12);c.globalAlpha=1}
 },
 readout:K=>['CACHED '+[...boxes].filter(b=>targets.has(b)).length+'/'+targets.size,'MOVES '+K.pad(moves)+' / ROOMS '+K.pad(wins)]
});
})();
</script></body></html>
