<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S105 — PIXEL MATCH</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A small picture on the right, an empty grid on the left. Copy it, cell by cell.
const PAL=['#0b1420','#28e3f4','#f4d84e','#ed4e8c','#8d78ff','#e9fbff'];
let N=10,tgt=null,mine=null,cur={r:0,c:0},color=1,wins=0,level=0,solved=0,cell=40,ox=0,oy=0,tcell=14,tx=0,ty=0,drag=null,moves=0;
const id=(r,c)=>r*N+c;
function gen(K){N=Math.min(16,10+level*2);tgt=new Uint8Array(N*N);const nc=Math.min(5,3+Math.floor(level/2)),half=Math.ceil(N/2);for(let r=0;r<N;r++)for(let c=0;c<half;c++){const v=K.noise(c*.45+level*3,r*.45+K.seed%7)>.5?1+Math.floor(K.rand()*nc):0;tgt[id(r,c)]=v;tgt[id(r,N-1-c)]=v}
 mine=new Uint8Array(N*N);cur={r:Math.floor(N/2),c:Math.floor(N/2)};color=1;solved=0;moves=0;cell=Math.min(K.w*.44/N,K.h*.66/N,48);ox=K.w*.1;oy=(K.h-cell*N)/2+8;tcell=Math.min(K.w*.18/N,K.h*.4/N,22);tx=K.w*.62;ty=oy+12}
function match(){let m=0;for(let i=0;i<N*N;i++)m+=mine[i]===tgt[i];return m}
function paint(K,r,c,v){if(solved||r<0||c<0||r>=N||c>=N)return;if(mine[id(r,c)]!==v){mine[id(r,c)]=v;moves++;if(match()===N*N){wins++;solved=.001;K.note('PICTURE MATCHED / '+K.pad(wins))}}}
const at=(K,x,y)=>{const c=Math.floor((x-ox)/cell),r=Math.floor((y-oy)/cell);return r>=0&&c>=0&&r<N&&c<N?{r,c}:null};
Salvage({id:'S105',title:'PIXEL MATCH',parent:'002 AFTERIMAGE DEBT',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE &nbsp;<kbd>SPACE</kbd> PAINT &nbsp;<kbd>X</kbd> ERASE &nbsp;<kbd>1</kbd>–<kbd>5</kbd> OR <kbd>Q</kbd><kbd>E</kbd> CHOOSE A COLOUR<br>MATCH EVERY CELL / DRAG THE POINTER TO PAINT, CLICK A SWATCH TO PICK IT',
 aria:'A pixel-copying puzzle. A small symmetric picture is shown on the right; copy it onto the grid on the left. Arrow keys move a cursor, Space paints the chosen colour and X erases. Number keys one to five or Q and E choose the colour. Dragging with the pointer paints, and clicking a swatch in the palette chooses it. Matching every cell starts a larger picture.',
 reset(K){level=0;wins=0;gen(K)},
 resize(K){cell=Math.min(K.w*.44/N,K.h*.66/N,48);ox=K.w*.1;oy=(K.h-cell*N)/2+8;tcell=Math.min(K.w*.18/N,K.h*.4/N,22);tx=K.w*.62;ty=oy+12},
 key(K,e,fresh){
  if(e.code==='Space'||e.code==='Enter'){paint(K,cur.r,cur.c,color);return true}
  if(e.code==='KeyX'||e.code==='Backspace'){paint(K,cur.r,cur.c,0);return true}
  if(fresh&&e.code==='KeyQ'){color=color<=1?5:color-1;return true}if(fresh&&e.code==='KeyE'){color=color>=5?1:color+1;return true}
  const m=/^(Digit|Numpad)([1-5])$/.exec(e.code);if(m){color=+m[2];return true}
  const d={ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1],ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0]}[e.code];if(d){if(fresh){cur.r=K.clamp(cur.r+d[0],0,N-1);cur.c=K.clamp(cur.c+d[1],0,N-1)}else{cur.r=K.clamp(cur.r+d[0],0,N-1);cur.c=K.clamp(cur.c+d[1],0,N-1)}if(K.keys.has('Space'))paint(K,cur.r,cur.c,color);return true}
 },
 down(K,x,y){const px=tx,py=ty+N*tcell+40,sw=Math.min(36,K.w*.04);for(let i=1;i<=5;i++){const bx=px+(i-1)*(sw+8);if(x>=bx&&x<=bx+sw&&y>=py&&y<=py+sw){color=i;return true}}const a=at(K,x,y);if(a){cur=a;drag=mine[id(a.r,a.c)]===color?0:color;paint(K,a.r,a.c,drag);return false}return false},
 up(){drag=null},
 step(K,dt){const p=K.pointer;if(p.held&&drag!==null&&p.inside){const a=at(K,p.x,p.y);if(a){cur=a;paint(K,a.r,a.c,drag)}}if(solved){solved+=dt;if(solved>2.2){level++;gen(K)}}},
 draw(K,c){
  const {w,h,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){const v=mine[id(r,q)],x=ox+q*cell,y=oy+r*cell,ok=v===tgt[id(r,q)];c.fillStyle=PAL[v];c.fillRect(x,y,cell-1,cell-1);if(v===0){c.fillStyle='#0f1b2a';c.fillRect(x+cell*.4,y+cell*.4,cell*.15,cell*.15)}if(ok&&v){c.fillStyle='#ffffff22';c.fillRect(x,y,cell-1,3)}if(!ok&&v){c.strokeStyle='#ed4e8c66';c.strokeRect(x+.5,y+.5,cell-2,cell-2)}}
  const hv=p.inside?at(K,p.x,p.y):null;if(hv){c.strokeStyle='#ed4e8c';c.strokeRect(ox+hv.c*cell+1.5,oy+hv.r*cell+1.5,cell-3,cell-3)}
  const cx=ox+cur.c*cell,cy=oy+cur.r*cell,b=1+Math.sin(K.time*6);c.strokeStyle='#faffdb';c.lineWidth=2;c.strokeRect(cx+b,cy+b,cell-b*2-1,cell-b*2-1);c.lineWidth=1;
  c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('YOURS / '+N+'×'+N,ox,oy-12);c.fillText('TARGET',tx,ty-12);
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){c.fillStyle=PAL[tgt[id(r,q)]];c.fillRect(tx+q*tcell,ty+r*tcell,tcell-1,tcell-1)}
  const px=tx,py=ty+N*tcell+40,sw=Math.min(36,w*.04);for(let i=1;i<=5;i++){const bx=px+(i-1)*(sw+8);c.fillStyle=PAL[i];c.fillRect(bx,py,sw,sw);c.strokeStyle=i===color?'#faffdb':'#2a3d5e';c.lineWidth=i===color?3:1;c.strokeRect(bx+.5,py+.5,sw-1,sw-1);c.lineWidth=1;c.fillStyle='#05070e';c.fillText(i,bx+sw/2-3,py+sw/2+3)}
  c.fillStyle='#ffffff22';c.fillRect(tx,py+sw+16,N*tcell,4);c.fillStyle=solved?'#f4d84e':'#10f4cf';c.fillRect(tx,py+sw+16,N*tcell*match()/(N*N),4);
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.strokeRect(ox-4,oy-4,N*cell+8,N*cell+8);c.globalAlpha=1}
 },
 readout:K=>['MATCH '+K.pad(match(),3)+'/'+K.pad(N*N,3),'PAINTED '+K.pad(moves)+' / DONE '+K.pad(wins)+' / '+N+'×'+N]
});
})();
</script></body></html>
