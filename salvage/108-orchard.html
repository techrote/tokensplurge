<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090a"><title>S108 — ORCHARD</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A tree is a rule applied to itself. Two numbers, the branching angle and the shrink ratio, decide what kind of tree it is.
const SPECIES=[['POPLAR',8,22,.72,.86],['OAK',22,38,.66,.78],['BIRCH',12,26,.58,.7],['SHRUB',38,56,.55,.66],['FERN',50,72,.7,.82],['WILLOW',28,46,.78,.9]];
let ang=24,ratio=.72,depth=8,branches=2,found=new Set(),holdT=0,cur=-1,wind=0,collected=0,palette=0;
const HUES=[[110,40],[30,50],[170,40],[300,35]];
function classify(){let best=-1,bd=1e9;SPECIES.forEach(([n,a0,a1,r0,r1],i)=>{const ca=(a0+a1)/2,cr=(r0+r1)/2,da=Math.abs(ang-ca)/((a1-a0)/2),dr=Math.abs(ratio-cr)/((r1-r0)/2),d=Math.max(da,dr);if(d<=1&&d<bd){bd=d;best=i}});return best}
Salvage({id:'S108',title:'ORCHARD',parent:'037 FAILURE WEAVE',bg:'#05090a',
 help:'<kbd>←</kbd><kbd>→</kbd> BRANCH ANGLE &nbsp;<kbd>↑</kbd><kbd>↓</kbd> SHRINK RATIO &nbsp;<kbd>SPACE</kbd> DEPTH / FOLIAGE<br>HOLD EACH KIND OF TREE STEADY TO COLLECT IT / THE POINTER BLOWS WIND, HOLD FOR A GALE',
 aria:'A recursive tree generator. Left and right arrows change the angle at which branches split and up and down change how much each branch shrinks. Space cycles how many levels of branching are drawn and the foliage colour. Particular combinations of angle and ratio produce recognisable kinds of tree such as poplar, oak, birch, shrub, fern and willow; holding a combination steady for two seconds collects it. The pointer position blows wind that sways the tree, and holding it makes a gale.',
 reset(K){ang=24;ratio=.72;depth=8;branches=2;found=new Set();holdT=0;cur=-1;collected=0;palette=0},
 key(K,e,fresh){if(e.code==='Space'){if(fresh){depth=depth>=10?6:depth+1;palette=(palette+1)%HUES.length}return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 step(K,dt){
  const da=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),dr=(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0)-(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0);
  ang=K.clamp(ang+da*dt*14,6,75);ratio=K.clamp(ratio+dr*dt*.1,.5,.92);
  const p=K.pointer;wind+=(((p.inside?(p.x/K.w-.5)*(p.held?3.2:1.4):0)+Math.sin(K.time*.7)*.15)-wind)*Math.min(1,dt*3);
  const c=classify();if(c===cur&&c>=0&&!K.keys.size){holdT+=dt;if(holdT>2&&!found.has(c)){found.add(c);collected++;K.note('COLLECTED / '+SPECIES[c][0]+' / '+found.size+' OF '+SPECIES.length)}}else{if(c!==cur)holdT=0;cur=c}
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#09131a');g.addColorStop(1,'#05090a');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='#10200f';c.fillRect(0,h*.88,w,h*.12);
  const L0=h*.2,hue=HUES[palette],t=K.time;let segs=0;
  function branch(x,y,a,len,d,thick){
   const sway=wind*(.12/(1+d*.1))*(10-d*.6)*.1+Math.sin(t*1.6+d+x*.01)*.012*(10-d);const aa=a+sway,x2=x+Math.cos(aa)*len,y2=y+Math.sin(aa)*len;
   c.strokeStyle=d<3?'#5a3d26':'hsl('+(hue[0]-d*3)+','+hue[1]+'%,'+(26+d*3)+'%)';c.lineWidth=Math.max(.6,thick);c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();segs++;
   if(d>=depth){c.fillStyle='hsla('+(hue[0]+20)+',70%,'+(45+K.hash(segs)*20)+'%,.8)';c.beginPath();c.arc(x2,y2,1.6,0,TAU);c.fill();return}
   const spread=ang*Math.PI/180,nl=len*ratio;
   branch(x2,y2,aa-spread,nl,d+1,thick*.72);branch(x2,y2,aa+spread,nl,d+1,thick*.72);
   if(branches>=3&&d%2===0)branch(x2,y2,aa+(K.hash(d*3+Math.floor(x))-.5)*.4,nl*.9,d+1,thick*.6)}
  branch(w/2,h*.88,-Math.PI/2,L0*(ratio>.8?.75:1),0,Math.max(2,h*.012));
  const sp=classify();c.font='11px monospace';c.textAlign='center';c.fillStyle=sp>=0?'#f4d84e':'#9fc4d6';c.fillText(sp>=0?SPECIES[sp][0]:'UNCLASSIFIED',w/2,h*.07);c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('ANGLE '+ang.toFixed(1)+'° / RATIO '+ratio.toFixed(2)+' / DEPTH '+depth,w/2,h*.07+16);
  c.fillStyle='#ffffff22';c.fillRect(w/2-60,h*.07+24,120,3);c.fillStyle='#f4d84e';c.fillRect(w/2-60,h*.07+24,120*Math.min(1,holdT/2),3);c.textAlign='left';
  c.fillStyle='#9fc4d6';c.fillText('COLLECTION',22,h*.15);SPECIES.forEach(([n],i)=>{c.fillStyle=found.has(i)?'#f4d84e':i===sp?'#faffdb':'#4f6b80';c.fillText((found.has(i)?'● ':'○ ')+n,22,h*.15+16+i*14)});
  const mx=w-150,my=h*.15,mw=120,mh=90;c.fillStyle='#05090acc';c.fillRect(mx-6,my-16,mw+12,mh+36);c.strokeStyle='#2a3d5e';c.strokeRect(mx-5.5,my-15.5,mw+11,mh+35);c.fillStyle='#9fc4d6';c.fillText('ANGLE → / RATIO ↑',mx,my-4);
  SPECIES.forEach(([n,a0,a1,r0,r1],i)=>{const x0=mx+(a0-6)/69*mw,x1=mx+(a1-6)/69*mw,y0=my+mh-(r1-.5)/.42*mh,y1=my+mh-(r0-.5)/.42*mh;c.strokeStyle=found.has(i)?'#f4d84e':'#4f6b80';c.strokeRect(x0,y0,x1-x0,y1-y0);c.fillStyle=found.has(i)?'#f4d84e':'#4f6b80';c.font='7px monospace';c.fillText(n.slice(0,3),x0+2,y0+8)});
  c.fillStyle='#faffdb';c.beginPath();c.arc(mx+(ang-6)/69*mw,my+mh-(ratio-.5)/.42*mh,3.5,0,TAU);c.fill();c.font='9px monospace';
  if(p.inside){c.globalAlpha=.5;c.strokeStyle='#faffdb';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+wind*60,p.y);c.stroke();c.globalAlpha=1;c.fillStyle='#faffdb';c.fillText(p.held?'GALE':'WIND',p.x+8,p.y-8)}
 },
 readout:K=>[(classify()>=0?SPECIES[classify()][0]:'—')+' / '+ang.toFixed(0)+'° '+ratio.toFixed(2),'COLLECTED '+K.pad(found.size)+'/'+SPECIES.length]
});
})();
</script></body></html>
