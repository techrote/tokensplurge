<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02050a"><title>S101 — FIREFLIES</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A hundred and twenty small lights, each flashing at its own pace and each watching its neighbours. Bring them into step.
const N=120;
let x=null,y=null,vx=null,vy=null,th=null,om=null,Kc=1.2,spread=.35,order=0,holdT=0,wins=0,best=0,chk=0;
function seed(K){x=new Float32Array(N).map(()=>Math.random()*K.w);y=new Float32Array(N).map(()=>Math.random()*K.h);vx=new Float32Array(N).map(()=>(Math.random()-.5)*8);vy=new Float32Array(N).map(()=>(Math.random()-.5)*8);th=new Float32Array(N).map(()=>Math.random()*K.TAU);om=new Float32Array(N).map(()=>1+(Math.random()-.5)*2*spread)}
Salvage({id:'S101',title:'FIREFLIES',parent:'018 CLOCK SECESSION',bg:'#02050a',scanlines:false,
 help:'<kbd>←</kbd><kbd>→</kbd> COUPLING &nbsp;<kbd>↑</kbd><kbd>↓</kbd> HOW DIFFERENT THEY ARE &nbsp;<kbd>SPACE</kbd> SCRAMBLE<br>HOLD THEM IN STEP FOR FIVE SECONDS / THE POINTER FLASHES THE LIGHTS NEAR IT, HOLD TO RESET THEM',
 aria:'A swarm of a hundred and twenty fireflies, each flashing at a slightly different natural rate and nudged by the flashes of neighbours within reach. Left and right arrows change the coupling strength and up and down change how different the natural rates are. Space scrambles all the phases. The goal is to get them flashing together and hold that for five seconds. The pointer flashes any lights near it and holding it resets them to the same phase.',
 reset(K){seed(K);Kc=1.2;spread=.35;holdT=0;wins=0;best=0;order=0},
 resize(K){seed(K)},
 key(K,e,fresh){if(e.code==='Space'){if(fresh){for(let i=0;i<N;i++)th[i]=Math.random()*K.TAU;holdT=0}return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 step(K,dt){
  const dk=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),ds=(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0)-(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0);
  Kc=K.clamp(Kc+dk*dt*1.5,0,8);const ns=K.clamp(spread+ds*dt*.4,.02,1.2);if(ns!==spread){const f=ns/spread;for(let i=0;i<N;i++)om[i]=1+(om[i]-1)*f;spread=ns}
  const p=K.pointer,R=140,w=K.w,h=K.h;
  for(let i=0;i<N;i++){let s=0,n=0;for(let j=0;j<N;j++){if(i===j)continue;let dx=x[j]-x[i],dy=y[j]-y[i];if(dx>w/2)dx-=w;else if(dx<-w/2)dx+=w;if(dy>h/2)dy-=h;else if(dy<-h/2)dy+=h;if(dx*dx+dy*dy<R*R){s+=Math.sin(th[j]-th[i]);n++}}
   let d=om[i]*2.2+(n?Kc*s/n*2.2:0);if(p.inside&&Math.hypot(p.x-x[i],p.y-y[i])<110){if(p.held)th[i]=0;else d+=6*Math.sin(-th[i])}
   th[i]=(th[i]+d*dt)%K.TAU;if(th[i]<0)th[i]+=K.TAU;
   vx[i]+=(Math.random()-.5)*20*dt;vy[i]+=(Math.random()-.5)*20*dt;vx[i]*=.98;vy[i]*=.98;x[i]=(x[i]+vx[i]*dt+w)%w;y[i]=(y[i]+vy[i]*dt+h)%h}
  chk-=dt;if(chk<=0){chk=.1;let sx=0,sy=0;for(let i=0;i<N;i++){sx+=Math.cos(th[i]);sy+=Math.sin(th[i])}order=Math.hypot(sx,sy)/N}
  if(order>.9){holdT+=dt;best=Math.max(best,holdT);if(holdT>5){wins++;K.note('IN STEP / '+K.pad(wins)+' / THEY WILL DRIFT AGAIN');holdT=0;for(let i=0;i<N;i++)th[i]=Math.random()*K.TAU}}else holdT=Math.max(0,holdT-dt*.5);
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#02050a';c.fillRect(0,0,w,h);
  c.globalCompositeOperation='lighter';
  for(let i=0;i<N;i++){const b=Math.pow(Math.max(0,Math.cos(th[i]-0)),8),a=.12+b*.88,r=3+b*10;const g=c.createRadialGradient(x[i],y[i],0,x[i],y[i],r*3);g.addColorStop(0,'rgba(244,232,120,'+a+')');g.addColorStop(1,'rgba(244,232,120,0)');c.fillStyle=g;c.fillRect(x[i]-r*3,y[i]-r*3,r*6,r*6)}
  c.globalCompositeOperation='source-over';
  const cx=w-120,cy=120;c.strokeStyle='#2a3d5e';c.beginPath();c.arc(cx,cy,40,0,TAU);c.stroke();let sx=0,sy=0;for(let i=0;i<N;i++){sx+=Math.cos(th[i]);sy+=Math.sin(th[i]);const a=th[i];c.fillStyle='#faffdb66';c.fillRect(cx+Math.cos(a)*40-1,cy+Math.sin(a)*40-1,2,2)}c.strokeStyle='#f4d84e';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+sx/N*40,cy+sy/N*40);c.stroke();c.lineWidth=1;
  c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('ORDER '+(order*100).toFixed(0)+'% / COUPLING '+Kc.toFixed(1)+' / SPREAD '+spread.toFixed(2),22,h*.12);c.fillStyle='#ffffff22';c.fillRect(22,h*.12+8,140,3);c.fillStyle=order>.9?'#f4d84e':'#7f97a5';c.fillRect(22,h*.12+8,140*Math.min(1,holdT/5),3);
  if(p.inside){c.globalAlpha=.4;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,110,0,TAU);c.stroke();c.globalAlpha=1;c.fillText(p.held?'RESET':'FLASH',p.x+8,p.y-8)}
 },
 readout:K=>['ORDER '+(order*100).toFixed(0)+'%','IN STEP '+K.pad(wins)+' / HOLD '+holdT.toFixed(1)+'s / BEST '+best.toFixed(1)+'s']
});
})();
</script></body></html>
