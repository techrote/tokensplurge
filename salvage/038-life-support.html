<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S038 — LIFE SUPPORT</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A small world that keeps trying to die or explode. Keep its population inside the band.
const CELL=10,RP=[[1,0],[2,0],[0,1],[1,1],[1,2]];
let cols=0,rows=0,a=null,b=null,age=null,cur={c:0,r:0},acc=0,held=0,total=0,gen=0,pop=0,lo=1,hi=2,extinct=0,repeat=0,ext=0;
const pal=Array.from({length:40},(_,i)=>{const t=i/39;return'hsl('+Math.round(180-t*210)+',85%,'+Math.round(50+t*14)+'%)'});
function soup(K,dens,cx,cy,rad){for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)if((rad===undefined||Math.hypot(i-cx,j-cy)<rad)&&K.rand()<dens){a[j*cols+i]=1;age[j*cols+i]=1}}
function init(K){cols=Math.ceil(K.w/CELL);rows=Math.ceil(K.h/CELL);a=new Uint8Array(cols*rows);b=new Uint8Array(cols*rows);age=new Uint16Array(cols*rows);soup(K,.12);cur={c:Math.floor(cols/2),r:Math.floor(rows/2)};lo=cols*rows*.012;hi=cols*rows*.05;acc=0}
function life(){
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let n=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++)if(di||dj)n+=a[((j+dj+rows)%rows)*cols+(i+di+cols)%cols];const k=j*cols+i,v=a[k]?(n===2||n===3?1:0):(n===3?1:0);b[k]=v;age[k]=v?(a[k]?Math.min(39,age[k]+1):1):0}
 const t=a;a=b;b=t;gen++;
}
const count=()=>{let n=0;for(let k=0;k<a.length;k++)n+=a[k];return n};
function stamp(c,r){for(const [dx,dy] of RP){const x=(c+dx+cols)%cols,y=(r+dy+rows)%rows;a[y*cols+x]=1;age[y*cols+x]=1}}
function cull(c,r){for(let dj=-3;dj<=3;dj++)for(let di=-3;di<=3;di++){const k=((r+dj+rows)%rows)*cols+(c+di+cols)%cols;a[k]=0;age[k]=0}}
const KD={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
Salvage({id:'S038',title:'LIFE SUPPORT',parent:'014 FALSE COLOUR NECROSIS',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE &nbsp;<kbd>SPACE</kbd> SEED LIFE &nbsp;<kbd>X</kbd> CULL<br>KEEP THE POPULATION INSIDE THE BAND / HOVER READS AGE, HOLD TO PAINT CELLS',
 aria:'A Conway game of life world. Arrow keys move a cursor, Space seeds a growing pattern there and X culls a block of cells. The goal is to keep the total population between a lower and an upper marker. The pointer shows the age of the cell beneath it and holding it paints live cells.',
 reset(K){init(K);total=0;gen=0;extinct=0;ext=0},
 resize(K){init(K)},
 key(K,e,fresh){
  const d=KD[e.code];if(d){if(fresh){repeat=.25;cur.c=(cur.c+d[0]+cols)%cols;cur.r=(cur.r+d[1]+rows)%rows}return true}
  if(e.code==='Space'){if(fresh)stamp(cur.c,cur.r);return true}
  if(e.code==='KeyX'||e.code==='Backspace'||e.code==='Delete'){if(fresh)cull(cur.c,cur.r);return true}
 },
 step(K,dt){
  if(K.keys.size){repeat-=dt;if(repeat<=0){repeat=.07;for(const c of K.keys){const d=KD[c];if(d){cur.c=(cur.c+d[0]+cols)%cols;cur.r=(cur.r+d[1]+rows)%rows;break}}}}
  const p=K.pointer;if(p.inside&&p.held){const i=Math.floor(p.x/CELL),j=Math.floor(p.y/CELL);for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const x=i+di,y=j+dj;if(x>=0&&y>=0&&x<cols&&y<rows&&!a[y*cols+x]){a[y*cols+x]=1;age[y*cols+x]=1}}}
  acc+=dt;while(acc>.12){acc-=.12;life()}
  pop=count();if(pop>=lo&&pop<=hi)total+=dt;
  if(pop===0){extinct++;K.note('EXTINCT / A SPARK IS PROVIDED');soup(K,.5,cols/2,rows/2,6)}
  if(pop>cols*rows*.2&&K.time-ext>4){ext=K.time;K.note('OVERPOPULATION / CULL WITH X')}
 },
 draw(K,c){
  const {w,h,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  for(let k=0;k<a.length;k++)if(a[k]){c.fillStyle=pal[Math.min(39,age[k])];c.fillRect(k%cols*CELL,Math.floor(k/cols)*CELL,CELL-1,CELL-1)}
  const cx=cur.c*CELL,cy=cur.r*CELL;c.strokeStyle='#faffdb';c.lineWidth=1.6;c.strokeRect(cx-.5,cy-.5,CELL+1,CELL+1);c.lineWidth=1;c.globalAlpha=.3;c.strokeRect(cx-3*CELL,cy-3*CELL,CELL*7,CELL*7);c.globalAlpha=1;
  const gx=w/2-120,gy=h-72,gw=240,mx=cols*rows*.08,pos=v=>gx+Math.min(1,v/mx)*gw;
  c.fillStyle='#ffffff22';c.fillRect(gx,gy,gw,5);const ok=pop>=lo&&pop<=hi;c.fillStyle=ok?'#10f4cf':'#ed4e8c';c.fillRect(pos(lo),gy-2,pos(hi)-pos(lo),9);c.fillStyle='#05070e';c.fillRect(pos(lo)+1,gy,pos(hi)-pos(lo)-2,5);c.fillStyle='#faffdb';c.fillRect(pos(pop)-1,gy-5,3,15);
  c.font='9px monospace';c.textAlign='center';c.fillStyle=ok?'#10f4cf':'#ed4e8c';c.fillText(ok?'IN BAND':pop<lo?'TOO FEW':'TOO MANY',w/2,gy-12);c.textAlign='left';
  if(p.inside){const i=K.clamp(Math.floor(p.x/CELL),0,cols-1),j=K.clamp(Math.floor(p.y/CELL),0,rows-1),n=j*cols+i;c.strokeStyle='#faffdb';c.strokeRect(i*CELL-.5,j*CELL-.5,CELL+1,CELL+1);c.fillStyle='#faffdb';c.fillText(a[n]?'AGE '+age[n]+(p.held?' / PAINTING':''):(p.held?'PAINTING':'EMPTY'),p.x+14,p.y-8)}
 },
 readout:K=>['POP '+K.pad(pop,4)+' ['+Math.round(lo)+'–'+Math.round(hi)+']','HELD '+K.pad(total,4)+'s / GEN '+K.pad(gen,4)]
});
})();
</script></body></html>
