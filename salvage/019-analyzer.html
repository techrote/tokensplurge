<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S019 — ANALYZER</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Every cell is a tiny polarizer. The picture is in how they disagree.
const CELL=11,PI=Math.PI,WORDS=['041','006','028','020','FAULT','VOID','LOSS','GLASS','LAST'];
let cols=0,rows=0,shape=null,noise=null,a0=0,alpha=0,holdX=0,capt=0,progress=0,contrast=0,word='';
function mask(K){
 cols=Math.ceil(K.w/CELL);rows=Math.ceil(K.h/CELL);const cv=document.createElement('canvas');cv.width=cols;cv.height=rows;const c=cv.getContext('2d');
 word=WORDS[Math.floor(K.rand()*WORDS.length)];c.fillStyle='#000';c.font='bold '+Math.min(rows*.62,cols*1.3/word.length)+'px monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(word,cols/2,rows/2);
 const d=c.getImageData(0,0,cols,rows).data;shape=new Uint8Array(cols*rows);noise=new Float32Array(cols*rows);
 for(let n=0;n<shape.length;n++){shape[n]=d[n*4+3]>110?1:0;noise[n]=(K.rand()-.5)*.7}
 a0=K.rand()*PI;progress=0;
}
Salvage({id:'S019',title:'ANALYZER',parent:'032 POLARIZATION SCHISM',bg:'#05070e',
 help:'<kbd>←</kbd><kbd>→</kbd> ROTATE THE ANALYZER &nbsp;<kbd>↑</kbd><kbd>↓</kbd> FINE ADJUST<br>HOLD <kbd>SPACE</kbd> WHILE THE WORD IS CLEAR / THE POINTER TWISTS THE CELLS',
 aria:'A mosaic of coloured cells whose brightness depends on an adjustable analyzer angle. A hidden word is made of cells at a different polarization from the background and appears at the right angle, which slowly drifts. Left and right rotate the analyzer; holding Space while the word is clear captures it. The pointer twists nearby cells.',
 reset(K){mask(K);alpha=K.rand()*PI;capt=0},
 resize(K){mask(K)},
 key(K,e,fresh){if(/^Arrow|^Key[WASD]$|^Space$/.test(e.code))return true},
 step(K,dt){
  const dx=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),fy=(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0)-(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0);
  holdX=dx?holdX+dt:0;alpha+=dx*dt*(.5+Math.min(1.5,holdX*1.2))+fy*dt*.15;
  if(K.keys.has('Space')){if(Math.abs(contrast)>.55)progress+=dt/1.2;else progress=Math.max(0,progress-dt*.8)}else progress=Math.max(0,progress-dt*.8);
  if(progress>=1){capt++;K.note('SCHISM CAPTURED / '+word);mask(K)}
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  const sa=a0+.35*Math.sin(K.time*.2),R=110;let sS=0,nS=0,sB=0,nB=0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
   const n=j*cols+i;let ang=(shape[n]?sa:sa+PI/2)+noise[n];
   if(p.inside){const d=Math.hypot(i*CELL+CELL/2-p.x,j*CELL+CELL/2-p.y);if(d<R){const q=1-d/R;ang+=(p.held?-1:1)*1.2*q*q}}
   const I=Math.pow(Math.cos(alpha-ang),2);if(shape[n]){sS+=I;nS++}else{sB+=I;nB++}
   const hue=Math.round((((ang%PI)+PI)%PI)/PI*300);c.fillStyle='hsl('+hue+',80%,'+Math.round(I*66)+'%)';c.fillRect(i*CELL,j*CELL,CELL-1,CELL-1);
  }
  contrast=nS&&nB?sS/nS-sB/nB:0;
  const cx=w-80,cy=130;c.strokeStyle='#e9fbff';c.fillStyle='#e9fbff';c.lineWidth=1.2;c.beginPath();c.arc(cx,cy,34,0,TAU);c.stroke();
  c.lineWidth=3;c.beginPath();c.moveTo(cx-Math.cos(alpha)*34,cy-Math.sin(alpha)*34);c.lineTo(cx+Math.cos(alpha)*34,cy+Math.sin(alpha)*34);c.stroke();c.lineWidth=1;
  c.font='9px monospace';c.textAlign='center';c.fillText('ANALYZER '+((((alpha%PI)+PI)%PI)*180/PI).toFixed(1)+'°',cx,cy+52);
  c.fillStyle='#ffffff33';c.fillRect(cx-40,cy+60,80,3);c.fillStyle=Math.abs(contrast)>.55?'#f4d84e':'#e9fbff';c.fillRect(cx-40,cy+60,80*progress,3);c.textAlign='left';
  if(p.inside){c.globalAlpha=.6;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,R,0,TAU);c.stroke();c.globalAlpha=1;c.fillStyle='#fff';c.fillText(p.held?'COUNTER-TWIST':'TWIST',p.x+R*.72,p.y-R*.72)}
 },
 readout:K=>['CONTRAST '+(Math.abs(contrast)*100).toFixed(0)+'%','HELD '+K.pad(capt)+' / '+word]
});
})();
</script></body></html>
