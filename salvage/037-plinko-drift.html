<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S037 — PLINKO DRIFT</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Drop a token. The pegs are not fixed in place and the bins are not fixed in value.
const PR=5,BR=7,NB=7,PA=[1,2,3,10,3,2,1];
let pegs=[],balls=[],vals=PA.slice(),dropX=.5,cool=0,score=0,drops=0,rot=0,area={x0:0,x1:0,y0:0,y1:0,by:0};
function layout(K){area={x0:K.w*.15,x1:K.w*.85,y0:K.h*.24,y1:K.h*.74,by:K.h*.8};pegs=[];const rows=9,cols=11,dx=(area.x1-area.x0)/(cols-1),dy=(area.y1-area.y0)/(rows-1);for(let r=0;r<rows;r++)for(let c=0;c<cols-(r%2);c++){const x=area.x0+c*dx+(r%2)*dx/2,y=area.y0+r*dy;pegs.push({hx:x,hy:y,x,y,vx:0,vy:0})}}
Salvage({id:'S037',title:'PLINKO DRIFT',parent:'033 WHITEOUT MEMORY',
 help:'<kbd>←</kbd><kbd>→</kbd> MOVE THE DROPPER &nbsp;<kbd>SPACE</kbd> DROP<br>THE POINTER PUSHES THE PEGS AWAY / HOLD FOR A WIDER PUSH',
 aria:'A Plinko board. Left and right arrows move a dropper at the top and Space drops a token that bounces down through a field of pegs into bins at the bottom, each with a value that slowly rotates. The pegs are springy: the pointer pushes them aside, and holding it pushes them in a wider area.',
 reset(K){layout(K);balls=[];vals=PA.slice();score=drops=0;dropX=.5;cool=0;rot=0},
 key(K,e,fresh){if(e.code==='Space'){if(fresh&&cool<=0){balls.push({x:area.x0+dropX*(area.x1-area.x0),y:area.y0-40,vx:(K.rand()-.5)*30,vy:0,trail:[]});cool=.5;drops++}return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 step(K,dt){
  const d=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0);dropX=K.clamp(dropX+d*dt*.6,0,1);cool=Math.max(0,cool-dt);
  rot+=dt;if(rot>14){rot=0;vals.unshift(vals.pop());K.note('THE BINS SHIFT')}
  const p=K.pointer,R=p.held?190:110;
  for(const g of pegs){let fx=(g.hx-g.x)*60,fy=(g.hy-g.y)*60;if(p.inside){const dx=g.x-p.x,dy=g.y-p.y,dd=Math.hypot(dx,dy)+.1;if(dd<R){const q=1-dd/R;fx+=dx/dd*q*3200;fy+=dy/dd*q*3200}}g.vx=(g.vx+fx*dt)*Math.exp(-dt*6);g.vy=(g.vy+fy*dt)*Math.exp(-dt*6);g.x+=g.vx*dt;g.y+=g.vy*dt}
  const bw=(area.x1-area.x0)/NB;
  for(let i=balls.length-1;i>=0;i--){
   const b=balls[i];b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.trail.push([b.x,b.y]);if(b.trail.length>12)b.trail.shift();
   if(b.x<area.x0-20){b.x=area.x0-20;b.vx=Math.abs(b.vx)*.6}if(b.x>area.x1+20){b.x=area.x1+20;b.vx=-Math.abs(b.vx)*.6}
   for(const g of pegs){const dx=b.x-g.x,dy=b.y-g.y,d=Math.hypot(dx,dy),m=PR+BR;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=g.x+nx*m;b.y=g.y+ny*m;const vn=(b.vx-g.vx)*nx+(b.vy-g.vy)*ny;if(vn<0){b.vx-=1.55*vn*nx;b.vy-=1.55*vn*ny}}}
   if(b.y>area.by){const bi=K.clamp(Math.floor((b.x-area.x0)/bw),0,NB-1),v=vals[bi];score+=v;K.live('Bin '+(bi+1)+' paid '+v);if(v>=10)K.note('JACKPOT / +'+v);balls.splice(i,1)}
  }
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K,bw=(area.x1-area.x0)/NB;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.strokeStyle='#17283a';c.strokeRect(area.x0-20.5,area.y0-60.5,area.x1-area.x0+41,area.by-area.y0+60);
  for(let i=0;i<NB;i++){const x=area.x0+i*bw;c.fillStyle=vals[i]>=10?'#3a2a08':'#0c1420';c.fillRect(x+2,area.by,bw-4,h*.1);c.strokeStyle=vals[i]>=10?'#f4d84e':'#2a3d5e';c.strokeRect(x+2.5,area.by+.5,bw-5,h*.1-1);c.fillStyle=vals[i]>=10?'#f4d84e':'#9fc4d6';c.font='bold 14px monospace';c.textAlign='center';c.fillText(vals[i],x+bw/2,area.by+h*.055)}
  for(const g of pegs){const dsp=Math.hypot(g.x-g.hx,g.y-g.hy),t=K.clamp(dsp/24);c.fillStyle=t>.05?K.DAMAGE[3]:'#b7f6ff';c.globalAlpha=.6+t*.4;c.beginPath();c.arc(g.x,g.y,PR,0,TAU);c.fill()}c.globalAlpha=1;
  for(const b of balls){b.trail.forEach(([x,y],k)=>{c.globalAlpha=k/12*.35;c.fillStyle='#faffdb';c.beginPath();c.arc(x,y,BR*.6,0,TAU);c.fill()});c.globalAlpha=1;c.fillStyle='#faffdb';c.beginPath();c.arc(b.x,b.y,BR,0,TAU);c.fill()}
  const dx=area.x0+dropX*(area.x1-area.x0);c.strokeStyle='#faffdb';c.lineWidth=1.6;c.beginPath();c.moveTo(dx-12,area.y0-56);c.lineTo(dx,area.y0-40);c.lineTo(dx+12,area.y0-56);c.stroke();c.lineWidth=1;
  c.globalAlpha=.5;c.beginPath();c.arc(dx,area.y0-18,8,-Math.PI/2,-Math.PI/2+TAU*(1-cool/.5));c.stroke();c.globalAlpha=1;
  c.font='9px monospace';c.textAlign='left';c.fillStyle='#faffdb';c.fillText('BINS SHIFT IN '+Math.ceil(14-rot)+'s',area.x0,area.by-12+h*.1+14);
  if(p.inside){c.globalAlpha=.4;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,p.held?190:110,0,TAU);c.stroke();c.globalAlpha=1;c.fillText(p.held?'WIDE PUSH':'PUSH',p.x+8,p.y-8)}
 },
 readout:K=>['SCORE '+K.pad(score,4),'DROPS '+K.pad(drops)+' / IN PLAY '+balls.length]
});
})();
</script></body></html>
