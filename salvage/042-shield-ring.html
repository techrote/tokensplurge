<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S042 — SHIELD RING</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Whatever is left of the picture sits at the centre. Things arrive from every direction.
const ARC=1.15,CR=24;
let a=0,av=0,shots=[],parts=[],core=100,blocked=0,best=0,spawn=0,hurt=0,falls=0;
const R=K=>Math.min(K.w,K.h)*.2;
Salvage({id:'S042',title:'SHIELD RING',parent:'039 THE BLIND SPOT',
 help:'<kbd>←</kbd><kbd>→</kbd> ROTATE THE SHIELD<br>THE POINTER SLOWS ANYTHING INSIDE ITS CIRCLE / HOLD TO REPEL',
 aria:'A core sits at the centre of the screen with a curved shield around it. Left and right arrows rotate the shield. Glitch projectiles arrive from all directions; those that hit the shield are blocked, those that miss damage the core. The pointer slows projectiles inside its circle and holding it pushes them away.',
 reset(K){a=-Math.PI/2;av=0;shots=[];parts=[];core=100;blocked=0;best=0;spawn=0;falls=0},
 key(K,e,fresh){if(/^Arrow|^Key[WASD]$|^Space$/.test(e.code))return true},
 step(K,dt){
  const d=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0);av+=d*22*dt;av*=Math.exp(-dt*9);av=K.clamp(av,-5.5,5.5);a+=av*dt;hurt=Math.max(0,hurt-dt*3);
  const cx=K.w/2,cy=K.h/2,p=K.pointer,rad=R(K);
  spawn-=dt;if(spawn<=0){spawn=Math.max(.35,1.3-blocked*.012);const an=K.rand()*K.TAU,dist=Math.hypot(K.w,K.h)/2+20;shots.push({x:cx+Math.cos(an)*dist,y:cy+Math.sin(an)*dist,sp:90+Math.min(110,blocked*.9),c:K.DAMAGE[Math.floor(K.rand()*6)],wob:K.rand()*K.TAU})}
  for(let i=shots.length-1;i>=0;i--){
   const s=shots[i];let dx=cx-s.x,dy=cy-s.y,dd=Math.hypot(dx,dy)||1,sp=s.sp;
   if(p.inside){const pd=Math.hypot(s.x-p.x,s.y-p.y);if(pd<150)sp*=p.held?.5:.3;if(p.held&&pd<150){s.x+=(s.x-p.x)/(pd+1)*120*dt;s.y+=(s.y-p.y)/(pd+1)*120*dt}}
   s.x+=dx/dd*sp*dt;s.y+=dy/dd*sp*dt;dx=cx-s.x;dy=cy-s.y;dd=Math.hypot(dx,dy);
   if(dd<=rad+6&&dd>rad-10){const ang=Math.atan2(s.y-cy,s.x-cx);if(Math.abs(K.wrap(ang-a))<ARC/2){blocked++;best=Math.max(best,blocked);for(let k=0;k<8;k++){const q=K.rand()*K.TAU,v=40+K.rand()*100;parts.push({x:s.x,y:s.y,vx:Math.cos(q)*v+(s.x-cx)*.4,vy:Math.sin(q)*v+(s.y-cy)*.4,t:0,c:s.c})}shots.splice(i,1);continue}}
   if(dd<CR){core-=10;hurt=1;shots.splice(i,1);if(core<=0){falls++;K.note('CORE LOST / '+blocked+' BLOCKED / IT RETURNS DIMLY');core=100;shots=[];blocked=0}}
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.t>.7)parts.splice(i,1)}
  core=Math.min(100,core+dt*1.2);
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K,cx=w/2,cy=h/2,rad=R(K);c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.strokeStyle='#10202e';c.setLineDash([2,6]);c.beginPath();c.arc(cx,cy,rad,0,TAU);c.stroke();c.setLineDash([]);
  c.lineWidth=7;c.strokeStyle='#28e3f4';c.beginPath();c.arc(cx,cy,rad,a-ARC/2,a+ARC/2);c.stroke();c.lineWidth=2;c.strokeStyle='#e9fbff';c.beginPath();c.arc(cx,cy,rad+5,a-ARC/2,a+ARC/2);c.stroke();c.lineWidth=1;
  const g=c.createRadialGradient(cx,cy,0,cx,cy,CR*2);g.addColorStop(0,hurt?'#ed4e8c':'#faffdb');g.addColorStop(1,'#faffdb00');c.fillStyle=g;c.beginPath();c.arc(cx,cy,CR*2,0,TAU);c.fill();c.fillStyle=hurt?'#ed4e8c':'#faffdb';c.beginPath();c.arc(cx,cy,CR*.55,0,TAU);c.fill();
  for(const s of shots){c.fillStyle=s.c;c.save();c.translate(s.x,s.y);c.rotate(Math.atan2(cy-s.y,cx-s.x));c.fillRect(-7,-2,12,4);c.fillRect(-12,-1,5,2);c.restore()}
  for(const q of parts){c.globalAlpha=1-q.t/.7;c.fillStyle=q.c;c.fillRect(q.x-1.5,q.y-1.5,3,3)}c.globalAlpha=1;
  c.fillStyle='#ffffff22';c.fillRect(cx-40,cy+rad+30,80,4);c.fillStyle=core>30?'#10f4cf':'#ed4e8c';c.fillRect(cx-40,cy+rad+30,80*core/100,4);c.font='9px monospace';c.textAlign='center';c.fillStyle='#9fc4d6';c.fillText('CORE',cx,cy+rad+24);c.textAlign='left';
  if(p.inside){c.globalAlpha=.4;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,150,0,TAU);c.stroke();c.globalAlpha=1;c.fillStyle='#faffdb';c.fillText(p.held?'REPEL':'SLOW',p.x+104,p.y-104)}
 },
 readout:K=>['BLOCKED '+K.pad(blocked),'CORE '+K.pad(core)+'% / BEST '+K.pad(best)+' / LOST '+K.pad(falls)]
});
})();
</script></body></html>
