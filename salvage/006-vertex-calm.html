<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S006 — VERTEX CALM</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A mesh in which panic travels along edges. One vertex at a time can be talked down.
let cols=0,rows=0,verts=[],sel=0,calmed=0,repeat=0,grab=-1;
const at=(i,j)=>verts[j*cols+i];
function disp(K,v,n){
 const t=K.time,amp=v.p*v.p*34+v.p*4;let x=v.rx+Math.sin(t*13+n*1.7)*amp+Math.sin(t*3.1+n)*amp*.6,y=v.ry+Math.cos(t*11+n*2.3)*amp+Math.cos(t*2.7+n*.7)*amp*.6;
 const p=K.pointer;if(p.inside){const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy)||1,R=Math.max(90,Math.min(K.w,K.h)*.15);if(d<R){const f=Math.pow(1-d/R,2)*R*.45;x+=dx/d*f;y+=dy/d*f}}
 if(n===grab){x=p.x;y=p.y}
 return[x,y];
}
const calm=()=>1-verts.reduce((s,v)=>s+v.p,0)/verts.length;
function settle(K,n){
 const v=verts[n];v.p=0;v.calm=4;v.ring=1;calmed++;
 const i=n%cols,j=Math.floor(n/cols);for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const q=at(i+di,j+dj);if(i+di>=0&&i+di<cols&&q)q.p*=.4}
}
Salvage({id:'S006',title:'VERTEX CALM',parent:'015 VERTEX PANIC',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> WALK THE MESH &nbsp;<kbd>SPACE</kbd> CALM A VERTEX<br>THE POINTER PUSHES / HOLD TO GRAB ONE',
 aria:'A coloured triangle mesh whose vertices jitter with spreading panic. Arrow keys move a selection between vertices; Space calms the selected vertex and soothes its neighbours. The pointer pushes vertices aside; holding it grabs and drags one, frightening it.',
 reset(K){
  cols=Math.round(K.clamp(K.w/72,8,22));rows=Math.round(K.clamp(K.h/72,6,14));verts=[];
  const mx=K.w*.08,my=K.h*.15,gw=(K.w-mx*2)/(cols-1),gh=(K.h-my*2)/(rows-1);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const edge=i===0||j===0||i===cols-1||j===rows-1;verts.push({rx:mx+i*gw+(edge?0:(K.rand()-.5)*gw*.5),ry:my+j*gh+(edge?0:(K.rand()-.5)*gh*.5),p:K.clamp(K.noise(i*.4,j*.4)*1.1-.1),calm:0,ring:0})}
  sel=Math.floor(rows/2)*cols+Math.floor(cols/2);calmed=0;
 },
 key(K,e,fresh){
  if(e.code==='Space'){if(fresh)settle(K,sel);return true}
  if(fresh&&/^(Arrow|Key[WASD]$)/.test(e.code)){repeat=.3;move(e.code);return true}
 },
 down(K,x,y){let best=-1,bd=40;verts.forEach((v,n)=>{const [vx,vy]=disp(K,v,n),d=Math.hypot(vx-x,vy-y);if(d<bd){bd=d;best=n}});grab=best;return false},
 up(){grab=-1},
 step(K,dt){
  if(K.keys.size){repeat-=dt;if(repeat<=0){repeat=.12;for(const c of K.keys)if(/^(Arrow|Key[WASD]$)/.test(c)){move(c);break}}}
  // Panic seeds itself somewhere every so often, then leaks along edges.
  if(K.rand()<dt*2.2){const v=verts[Math.floor(K.rand()*verts.length)];if(!v.calm)v.p=Math.min(1,v.p+.35)}
  const next=verts.map((v,n)=>{const i=n%cols,j=Math.floor(n/cols);let m=0;for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]])if(i+di>=0&&i+di<cols&&j+dj>=0&&j+dj<rows)m=Math.max(m,at(i+di,j+dj).p);return m});
  verts.forEach((v,n)=>{
   if(v.calm>0)v.calm-=dt;else v.p=Math.min(1,v.p+Math.max(0,next[n]-v.p)*dt*.09+dt*.004);
   if(K.pointer.inside&&K.pointer.speed>.2){const [x,y]=[v.rx,v.ry];if(Math.hypot(x-K.pointer.x,y-K.pointer.y)<90)v.p=Math.min(1,v.p+K.pointer.speed*dt*.12)}
   if(n===grab)v.p=Math.min(1,v.p+dt*.5);
   v.ring=Math.max(0,v.ring-dt*1.4);
  });
 },
 draw(K,c){
  const {w,h,TAU}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  const pos=verts.map((v,n)=>disp(K,v,n)),g=c.createLinearGradient(w*.05,0,w*.95,0);K.SPECTRUM.forEach((s,i)=>g.addColorStop(i/5,s));
  for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
   const a=j*cols+i,b=a+1,d=a+cols,e=d+1;
   for(const tri of [[a,b,e],[a,e,d]]){
    const pn=(verts[tri[0]].p+verts[tri[1]].p+verts[tri[2]].p)/3;
    c.beginPath();c.moveTo(...pos[tri[0]]);c.lineTo(...pos[tri[1]]);c.lineTo(...pos[tri[2]]);c.closePath();
    c.globalAlpha=.75-pn*.55;c.fillStyle=g;c.fill();
    if(pn>.15){c.globalAlpha=pn*.45;c.fillStyle=(i+j)%2?'#ed4e8c':'#03040b';c.fill()}
   }
  }
  c.lineWidth=.7;
  for(let n=0;n<verts.length;n++){const i=n%cols,j=Math.floor(n/cols),v=verts[n];
   for(const m of [i<cols-1?n+1:-1,j<rows-1?n+cols:-1,i<cols-1&&j<rows-1?n+cols+1:-1]){if(m<0)continue;const pp=(v.p+verts[m].p)/2;c.globalAlpha=.35+pp*.5;c.strokeStyle=pp>.5?'#ed4e8c':'#b5dfea';c.beginPath();c.moveTo(...pos[n]);c.lineTo(...pos[m]);c.stroke()}}
  c.lineWidth=1;
  verts.forEach((v,n)=>{const [x,y]=pos[n];c.globalAlpha=.6+v.p*.4;c.fillStyle=v.calm>0?'#f4d84e':v.p>.6?'#ed4e8c':'#e9fbff';c.fillRect(x-1.5,y-1.5,3,3);
   if(v.ring){c.globalAlpha=v.ring;c.strokeStyle='#f4d84e';c.beginPath();c.arc(x,y,(1-v.ring)*70+4,0,TAU);c.stroke()}});
  const [sx,sy]=pos[sel],v=verts[sel],s=9+Math.sin(K.time*4)*1.5;
  c.save();c.translate(sx,sy);c.rotate(K.time*.8);c.globalAlpha=1;c.strokeStyle='#faffdb';c.strokeRect(-s,-s,s*2,s*2);c.restore();
  c.font='9px monospace';c.fillStyle='#faffdb';c.fillText('V '+K.pad(sel%cols,2)+':'+K.pad(Math.floor(sel/cols),2)+' / PANIC '+(v.p*100).toFixed(0)+'%'+(v.calm>0?' / CALM '+v.calm.toFixed(1)+'s':''),sx+16,sy-12);
  if(grab>=0){c.fillStyle='#ed4e8c';c.fillText('HELD / IT DOES NOT LIKE THIS',K.pointer.x+14,K.pointer.y+18)}
 },
 readout:K=>['CALM '+(calm()*100).toFixed(2)+'%','CALMED '+K.pad(calmed)]
});
function move(code){
 const i=sel%cols,j=Math.floor(sel/cols),d={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[code];
 if(!d)return;const ni=Math.max(0,Math.min(cols-1,i+d[0])),nj=Math.max(0,Math.min(rows-1,j+d[1]));sel=nj*cols+ni;
}
})();
</script></body></html>
