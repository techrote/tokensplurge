<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S025 — CODEC MERGE</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Slide the board. Equal blocks merge into one of the next level, until there is no room left to compress.
const N=4,PAL=['#10f4cf','#196fff','#f4d84e','#ed4e8c','#8d78ff','#b7f6ff','#fe6741','#28e3f4','#e4f2bf','#f1118b','#5920ab','#faffdb'];
let tiles=[],grid=null,best=1,moves=0,over=false,games=0;
const empty=()=>Array.from({length:N},()=>new Array(N).fill(null));
function spawn(K){const free=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])free.push([r,c]);if(!free.length)return;const [r,c]=free[Math.floor(K.rand()*free.length)],t={v:K.rand()<.88?1:2,r,c,x:c,y:r,gone:false,pop:1};grid[r][c]=t;tiles.push(t)}
function init(K){tiles=[];grid=empty();spawn(K);spawn(K);moves=0;over=false}
function canMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!grid[r][c])return true;if(c<N-1&&grid[r][c+1]&&grid[r][c+1].v===grid[r][c].v)return true;if(r<N-1&&grid[r+1][c]&&grid[r+1][c].v===grid[r][c].v)return true}return false}
function slide(K,dr,dc){
 let changed=false;
 for(let i=0;i<N;i++){
  const line=[];for(let j=0;j<N;j++)line.push([dr===0?i:(dr>0?N-1-j:j),dc===0?i:(dc>0?N-1-j:j)]);
  const ts=line.map(([r,c])=>grid[r][c]).filter(Boolean),out=[];
  for(const t of ts){const last=out[out.length-1];if(last&&last.v===t.v&&!last.merged){last.v++;last.merged=true;last.pop=1;t.gone=true;t.tr=last;changed=true}else out.push(t)}
  line.forEach(([r,c],k)=>{const t=out[k]||null;grid[r][c]=t;if(t){if(t.r!==r||t.c!==c)changed=true;t.r=r;t.c=c}});
 }
 for(const t of tiles)if(t.gone){t.r=t.tr.r;t.c=t.tr.c}
 for(const t of tiles)t.merged=false;
 if(changed){moves++;spawn(K);for(const t of tiles)if(!t.gone&&t.v>best){best=t.v;K.note('LEVEL '+best+' / 0x'+(1<<best).toString(16).toUpperCase())}}
 if(!canMove()){over=true;K.note('ARTEFACT LIMIT / ANY ARROW TO RECOMPRESS')}
}
const board=K=>{const side=Math.min(K.w,K.h*.8)*.7;return{side,cell:side/N,x0:(K.w-side)/2,y0:(K.h-side)/2+8}};
Salvage({id:'S025',title:'CODEC MERGE',parent:'025 CODEC LARVAE',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> SLIDE THE BLOCKS &nbsp;EQUAL BLOCKS MERGE<br>THE POINTER TILTS THE BOARD / HOVER TO READ A BLOCK',
 aria:'A four by four board of coloured compression blocks. Arrow keys slide every block; equal blocks merge into a higher level, shown as a hexadecimal value. When no move remains the board recompresses. The pointer tilts the blocks in parallax and hovering a block shows its address.',
 reset(K){init(K);best=1;games=0},
 key(K,e,fresh){
  const d={ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1],ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0]}[e.code];
  if(!d)return;if(fresh){if(over){games++;init(K)}else slide(K,d[0],d[1])}return true;
 },
 step(K,dt){
  const k=Math.min(1,dt*16);
  for(let i=tiles.length-1;i>=0;i--){const t=tiles[i];t.x+=(t.c-t.x)*k;t.y+=(t.r-t.y)*k;t.pop=Math.max(0,t.pop-dt*5);if(t.gone&&Math.abs(t.x-t.c)+Math.abs(t.y-t.r)<.05)tiles.splice(i,1)}
 },
 draw(K,c){
  const {w,h,pointer:p}=K,B=board(K);c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.fillStyle='#0c1420';c.fillRect(B.x0-8,B.y0-8,B.side+16,B.side+16);
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){c.fillStyle='#050a12';c.fillRect(B.x0+q*B.cell+3,B.y0+r*B.cell+3,B.cell-6,B.cell-6)}
  const tx=p.inside?(p.x-w/2)/w:0,ty=p.inside?(p.y-h/2)/h:0;let hover=null;
  for(const t of tiles.slice().sort((a,b)=>a.v-b.v)){
   const s=1+t.pop*.12,cw=B.cell-6,x=B.x0+t.x*B.cell+3-(cw*(s-1))/2+tx*t.v*3,y=B.y0+t.y*B.cell+3-(cw*(s-1))/2+ty*t.v*3;
   c.globalAlpha=t.gone?.6:1;c.fillStyle=PAL[(t.v-1)%PAL.length];c.fillRect(x,y,cw*s,cw*s);
   c.fillStyle='#05070e';c.globalAlpha=(t.gone?.6:1)*.28;const f=1+t.v%4;for(let a=0;a<4;a++)for(let b=0;b<4;b++)if((a*f+b*(5-f))%2)c.fillRect(x+a*cw*s/4,y+b*cw*s/4,cw*s/4,cw*s/4);
   c.globalAlpha=t.gone?.6:1;c.fillStyle='#05070e';c.font='bold '+Math.round(cw*.26)+'px monospace';c.textAlign='center';c.fillText('0x'+(1<<t.v).toString(16).toUpperCase(),x+cw*s/2,y+cw*s/2+cw*.09);
   if(p.inside&&p.x>x&&p.x<x+cw&&p.y>y&&p.y<y+cw&&!t.gone)hover=[t,x,y,cw];
  }
  c.globalAlpha=1;c.textAlign='left';c.font='9px monospace';
  if(hover){const [t,x,y,cw]=hover;c.strokeStyle='#faffdb';c.lineWidth=1.6;c.strokeRect(x-2,y-2,cw+4,cw+4);c.lineWidth=1;c.fillStyle='#faffdb';c.fillText('BLOCK @ '+K.pad(t.r*N+t.c,2)+' / LEVEL '+t.v+(p.held?' / 0b'+(1<<t.v).toString(2):''),p.x+12,p.y-10)}
  if(over){c.fillStyle='#05070ecc';c.fillRect(B.x0-8,B.y0-8,B.side+16,B.side+16);c.fillStyle='#faffdb';c.textAlign='center';c.font='14px monospace';c.fillText('ARTEFACT LIMIT',w/2,h/2+4);c.font='9px monospace';c.fillText('ANY ARROW TO RECOMPRESS',w/2,h/2+24);c.textAlign='left'}
 },
 readout:K=>['LEVEL '+K.pad(best,2),'MOVES '+K.pad(moves)+' / BOARDS '+K.pad(games+1)]
});
})();
</script></body></html>
