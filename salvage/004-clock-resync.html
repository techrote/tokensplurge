<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S004 — CLOCK RESYNC</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Twelve clocks that have each decided what time it is. A sweep passes over them like a conductor nobody watches.
const N=12;let clocks=[],master=0,resynced=0,misses=0,flash=0;
const mix=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'};
const geometry=K=>{const m=Math.min(K.w,K.h);return{cx:K.w/2,cy:K.h/2+8,R:m*.33,r:Math.max(16,m*.062)}};
const sweep=K=>K.time*K.TAU/4.5-Math.PI/2;
const lens=(K,x,y)=>{const p=K.pointer;if(!p.inside)return 0;const L=1-Math.hypot(x-p.x,y-p.y)/Math.max(110,Math.min(K.w,K.h)*.2);return L>0?L*L*(3-2*L):0};
function at(K,i){const g=geometry(K),a=i/N*K.TAU-Math.PI/2;return{x:g.cx+Math.cos(a)*g.R,y:g.cy+Math.sin(a)*g.R,a}}
function sync(K){let s=0;for(const c of clocks)s+=1-Math.abs(K.wrap(c.phase-master))/Math.PI;return s/N}
Salvage({id:'S004',title:'CLOCK RESYNC',parent:'018 CLOCK SECESSION',
 help:'<kbd>SPACE</kbd> AS THE SWEEP CROSSES A CLOCK THAT DISAGREES<br>THE POINTER SLOWS TIME AROUND IT',
 aria:'Twelve clock faces in a ring, each drifting away from a master clock at the centre. A sweep arm circles them; pressing Space as it crosses a disagreeing clock resynchronises it. The pointer slows time nearby; holding it runs time backwards.',
 reset(K){master=0;resynced=misses=0;clocks=Array.from({length:N},(_,i)=>({phase:(K.rand()-.5)*2.4,drift:(K.rand()-.5)*.5,flash:0,label:''}))},
 resize(){},
 key(K,e,fresh){
  if(e.code!=='Space'||!fresh)return;
  const s=sweep(K);let best=-1,bd=.13;
  clocks.forEach((c,i)=>{const d=Math.abs(K.wrap(s-at(K,i).a));if(d<bd){bd=d;best=i}});
  if(best<0){misses++;flash=.6;K.note('NO CLOCK UNDER THE SWEEP');return true}
  const c=clocks[best],err=Math.abs(K.wrap(c.phase-master));
  c.phase=master;c.drift=(K.rand()-.5)*.03;c.flash=1;resynced++;
  if(err<.1)K.note('CLOCK '+K.pad(best+1,2)+' WAS ALREADY RIGHT');else K.live('Clock '+(best+1)+' resynchronised');
  return true;
 },
 step(K,dt){
  const rate=K.TAU/12;master+=rate*dt;flash=Math.max(0,flash-dt*2);
  clocks.forEach((c,i)=>{
   const p=at(K,i),L=lens(K,p.x,p.y),local=K.pointer.held?1-L*1.9:1-L*.85;
   c.phase+=rate*dt*(1+c.drift)*local;
   // Secession is contagious: a drifting clock nudges its neighbours further from the centre.
   c.drift+=(K.rand()-.5)*dt*.08+Math.sign(c.drift)*dt*.012;c.drift=K.clamp(c.drift,-.9,.9);
   c.flash=Math.max(0,c.flash-dt*1.5);
  });
 },
 draw(K,c){
  const {w,h,TAU}=K,g=geometry(K),s=sweep(K);
  const bg=c.createRadialGradient(g.cx,g.cy,0,g.cx,g.cy,Math.max(w,h)*.7);bg.addColorStop(0,'#0f1d33');bg.addColorStop(1,'#03050b');c.fillStyle=bg;c.fillRect(0,0,w,h);
  if(flash){c.fillStyle='#ed4e8c';c.globalAlpha=flash*.08;c.fillRect(0,0,w,h);c.globalAlpha=1}
  c.strokeStyle='#22344a';c.beginPath();c.arc(g.cx,g.cy,g.R,0,TAU);c.stroke();
  for(let k=0;k<120;k++){const a=k/120*TAU,l=k%10?4:10;c.beginPath();c.moveTo(g.cx+Math.cos(a)*(g.R+g.r*1.6),g.cy+Math.sin(a)*(g.R+g.r*1.6));c.lineTo(g.cx+Math.cos(a)*(g.R+g.r*1.6+l),g.cy+Math.sin(a)*(g.R+g.r*1.6+l));c.stroke()}
  // The sweep and its fading wake.
  for(let k=0;k<18;k++){c.globalAlpha=(1-k/18)*.16;c.fillStyle='#28e3f4';c.beginPath();c.moveTo(g.cx,g.cy);c.arc(g.cx,g.cy,g.R+g.r*1.5,s-(k+1)*.035,s-k*.035);c.closePath();c.fill()}
  c.globalAlpha=.9;c.strokeStyle='#b7f6ff';c.beginPath();c.moveTo(g.cx,g.cy);c.lineTo(g.cx+Math.cos(s)*(g.R+g.r*1.6),g.cy+Math.sin(s)*(g.R+g.r*1.6));c.stroke();
  // Master clock.
  const mr=g.R*.42;c.globalAlpha=1;c.strokeStyle='#e4f2bf';c.lineWidth=1.5;c.beginPath();c.arc(g.cx,g.cy,mr,0,TAU);c.stroke();
  for(let k=0;k<12;k++){const a=k/12*TAU;c.beginPath();c.moveTo(g.cx+Math.cos(a)*mr*.86,g.cy+Math.sin(a)*mr*.86);c.lineTo(g.cx+Math.cos(a)*mr,g.cy+Math.sin(a)*mr);c.stroke()}
  c.lineWidth=2;c.beginPath();c.moveTo(g.cx,g.cy);c.lineTo(g.cx+Math.cos(master-Math.PI/2)*mr*.8,g.cy+Math.sin(master-Math.PI/2)*mr*.8);c.stroke();
  c.lineWidth=1;c.fillStyle='#e4f2bf';c.font='9px monospace';c.textAlign='center';
  const secs=(master/TAU*12)%12;c.fillText('MASTER '+secs.toFixed(3)+'s',g.cx,g.cy+mr+16);
  clocks.forEach((ck,i)=>{
   const p=at(K,i),L=lens(K,p.x,p.y),r=g.r*(1+L*.45),err=K.wrap(ck.phase-master),e=Math.min(1,Math.abs(err)/1.6),under=Math.abs(K.wrap(s-p.a))<.13;
   c.globalAlpha=1;c.fillStyle='#04070f';c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill();
   c.strokeStyle=under?'#faffdb':mix('#4f6b80','#ed4e8c',e);c.lineWidth=under?1.6:1;c.stroke();c.lineWidth=1;
   for(let k=0;k<12;k++){const a=k/12*TAU,jit=e*Math.sin(K.time*9+k+i)*.08;c.beginPath();c.moveTo(p.x+Math.cos(a+jit)*r*.8,p.y+Math.sin(a+jit)*r*.8);c.lineTo(p.x+Math.cos(a+jit)*r*.95,p.y+Math.sin(a+jit)*r*.95);c.stroke()}
   c.globalAlpha=.35;c.strokeStyle='#e4f2bf';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(master-Math.PI/2)*r*.7,p.y+Math.sin(master-Math.PI/2)*r*.7);c.stroke();
   c.globalAlpha=1;c.strokeStyle=mix('#b7f6ff','#ed4e8c',e);c.lineWidth=2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(ck.phase-Math.PI/2)*r*.85,p.y+Math.sin(ck.phase-Math.PI/2)*r*.85);c.stroke();c.lineWidth=1;
   if(ck.flash){c.globalAlpha=ck.flash;c.strokeStyle='#f4d84e';c.beginPath();c.arc(p.x,p.y,r+(1-ck.flash)*r*1.4,0,TAU);c.stroke()}
   c.globalAlpha=.55+L*.45;c.fillStyle=mix('#7f97a5','#ed4e8c',e);
   const off=err/TAU*12;c.fillText((off>=0?'+':'')+off.toFixed(2)+'s',p.x,p.y+r+12);
   if(L>.2){c.globalAlpha=L;c.fillStyle='#faffdb';c.fillText(K.pointer.held?'Δt ×'+(1-L*1.9).toFixed(2)+' / REVERSING':'Δt ×'+(1-L*.85).toFixed(2),p.x,p.y-r-8)}
  });
  c.textAlign='left';
 },
 readout:K=>['SYNC '+(sync(K)*100).toFixed(2)+'%','RESYNCED '+K.pad(resynced)+' / EARLY '+K.pad(misses)]
});
})();
</script></body></html>
