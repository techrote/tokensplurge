<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S109 — KNIGHT'S TOUR</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A knight, a board and the rule that nowhere may be visited twice. Hover a square to see how many ways out it leaves.
const KM=[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
let N=5,path=[],vis=null,cur={r:0,c:0},wins=0,level=0,stuck=0,cell=60,ox=0,oy=0,solved=0,undos=0,placed=false;
const id=(r,c)=>r*N+c,inb=(r,c)=>r>=0&&c>=0&&r<N&&c<N;
function init(K){N=Math.min(8,5+level);vis=new Int16Array(N*N);path=[];placed=false;cur={r:Math.floor(N/2),c:Math.floor(N/2)};solved=0;stuck=0;cell=Math.min(K.w*.8/N,K.h*.72/N,84);ox=(K.w-cell*N)/2;oy=(K.h-cell*N)/2+8}
function onward(r,c){let n=0;for(const [a,b] of KM){const rr=r+a,cc=c+b;if(inb(rr,cc)&&!vis[id(rr,cc)])n++}return n}
function legal(r,c){const k=path[path.length-1];if(!k)return true;return KM.some(([a,b])=>k[0]+a===r&&k[1]+b===c)&&!vis[id(r,c)]}
function go(K,r,c){if(solved)return;if(!legal(r,c)){K.note(path.length?'A KNIGHT CANNOT GO THERE':'');return}path.push([r,c]);vis[id(r,c)]=path.length;
 if(path.length===N*N){wins++;solved=.001;K.note('EVERY SQUARE ONCE / '+N+'×'+N+' / '+K.pad(wins))}
 else{const k=path[path.length-1];let any=false;for(const [a,b] of KM){const rr=k[0]+a,cc=k[1]+b;if(inb(rr,cc)&&!vis[id(rr,cc)])any=true}if(!any){stuck=1;K.note('DEAD END AFTER '+path.length+' / Z TO STEP BACK')}}}
function undo(){if(!path.length||solved)return;const [r,c]=path.pop();vis[id(r,c)]=0;stuck=0;undos++}
const at=(K,x,y)=>{const c=Math.floor((x-ox)/cell),r=Math.floor((y-oy)/cell);return r>=0&&c>=0&&r<N&&c<N?{r,c}:null};
Salvage({id:'S109',title:"KNIGHT'S TOUR",parent:'027 HEREDITARY SCRATCH',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE THE CURSOR &nbsp;<kbd>SPACE</kbd> PLACE OR MOVE THE KNIGHT &nbsp;<kbd>Z</kbd> STEP BACK<br>VISIT EVERY SQUARE ONCE / HOVER A SQUARE TO SEE HOW MANY MOVES IT LEAVES, CLICK TO GO',
 aria:'A knight\'s tour puzzle. Arrow keys move a cursor over the board and Space places the knight on the first square or moves it by a knight\'s move to an unvisited square. Z steps back. The goal is to visit every square exactly once. Legal moves are marked with the number of onward moves each would leave, which is the key to the Warnsdorff method. Hovering shows the same for any square and clicking moves there. Boards get larger as you win.',
 reset(K){level=0;wins=0;undos=0;init(K)},
 resize(K){cell=Math.min(K.w*.8/N,K.h*.72/N,84);ox=(K.w-cell*N)/2;oy=(K.h-cell*N)/2+8},
 key(K,e,fresh){
  if(e.code==='Space'||e.code==='Enter'){if(fresh)go(K,cur.r,cur.c);return true}if(e.code==='KeyZ'||e.code==='Backspace'){if(fresh)undo();return true}
  const d={ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1],ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0]}[e.code];if(d){if(fresh){cur.r=K.clamp(cur.r+d[0],0,N-1);cur.c=K.clamp(cur.c+d[1],0,N-1)}return true}
 },
 down(K,x,y){const a=at(K,x,y);if(!a)return false;cur=a;go(K,a.r,a.c);return true},
 step(K,dt){if(solved){solved+=dt;if(solved>2.4){level++;init(K)}}},
 draw(K,c){
  const {w,h,TAU,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);const hv=p.inside?at(K,p.x,p.y):null,k=path[path.length-1];
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){const x=ox+q*cell,y=oy+r*cell,v=vis[id(r,q)],lg=legal(r,q)&&path.length&&!v;c.fillStyle=(r+q)%2?'#0a1522':'#0f1b2a';c.fillRect(x,y,cell,cell);
   if(v){c.fillStyle=solved?K.DAMAGE[v%6]:'#28e3f433';c.fillRect(x+2,y+2,cell-4,cell-4);c.fillStyle='#9fc4d6';c.font=Math.round(cell*.28)+'px monospace';c.textAlign='center';c.fillText(v,x+cell/2,y+cell*.62);c.textAlign='left'}
   if(lg||(hv&&hv.r===r&&hv.c===q&&!v&&(!path.length||legal(r,q)))){c.strokeStyle='#faffdb';c.globalAlpha=.7;c.strokeRect(x+3.5,y+3.5,cell-7,cell-7);c.globalAlpha=1;const n=onward(r,q)-(path.length&&!vis[id(r,q)]&&k&&false?0:0);c.fillStyle=n===0?'#ed4e8c':n<=2?'#f4d84e':'#10f4cf';c.font='bold '+Math.round(cell*.3)+'px monospace';c.textAlign='center';c.fillText(n,x+cell/2,y+cell*.66);c.textAlign='left'}}
  c.strokeStyle='#28e3f4';c.lineWidth=2;c.beginPath();path.forEach(([r,q],i)=>{const x=ox+(q+.5)*cell,y=oy+(r+.5)*cell;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.lineWidth=1;
  if(k){c.fillStyle='#faffdb';c.font='bold '+Math.round(cell*.6)+'px monospace';c.textAlign='center';c.fillText('♞',ox+(k[1]+.5)*cell,oy+(k[0]+.5)*cell+cell*.2);c.textAlign='left'}
  const cx=ox+cur.c*cell,cy=oy+cur.r*cell,b=3+Math.sin(K.time*5);c.strokeStyle=stuck?'#ed4e8c':'#faffdb';c.lineWidth=2;c.strokeRect(cx+b,cy+b,cell-b*2,cell-b*2);c.lineWidth=1;
  c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText(N+'×'+N+' / VISITED '+path.length+'/'+N*N+(stuck?' / DEAD END':''),ox,oy-12);
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.strokeRect(ox-5,oy-5,N*cell+10,N*cell+10);c.globalAlpha=1}
 },
 readout:K=>['VISITED '+K.pad(path.length,2)+'/'+K.pad(N*N,2),'TOURS '+K.pad(wins)+' / UNDOS '+K.pad(undos)+' / '+N+'×'+N]
});
})();
</script></body></html>
