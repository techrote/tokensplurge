<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S063 — TERRAFORM</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Match the ground to the survey. Raise and lower one column at a time.
const N=9,MAXH=6;
let H=null,T=null,cur={r:4,c:4},moves=0,wins=0,solved=0,repeat=0,tw=60,hz=14,ox=0,oy=0,pal=[];
for(let i=0;i<=MAXH;i++)pal.push(['#10202e','#1d6fe0','#28e3f4','#e4f2bf','#f4d84e','#fe6741','#ed4e8c'][i]);
const idx=(r,c)=>r*N+c;
function layout(K){tw=Math.min(K.w/(N*1.1),K.h/(N*.62),70);hz=tw*.26;ox=K.w/2+K.w*.08;oy=K.h*.2}
function gen(K){H=new Uint8Array(N*N);T=new Uint8Array(N*N);for(let r=0;r<N;r++)for(let c=0;c<N;c++)T[idx(r,c)]=Math.min(MAXH,Math.floor(K.noise(c*.5+wins,r*.5)*MAXH*1.25));cur={r:Math.floor(N/2),c:Math.floor(N/2)};solved=0;moves=0;for(let k=0;k<Math.min(14,4+wins*2);k++){const i=Math.floor(K.rand()*N*N);H[i]=T[i]}}
const iso=(r,c)=>[ox+(c-r)*tw/2,oy+(c+r)*tw/4];
function set(K,r,c,d){if(solved)return;const i=idx(r,c),v=H[i]+d;if(v<0||v>MAXH)return;H[i]=v;moves++;if(match()===N*N){wins++;solved=.001;K.note('SURVEY MATCHED / '+K.pad(wins)+' / THE GROUND SHIFTS')}}
const match=()=>{let m=0;for(let i=0;i<N*N;i++)m+=H[i]===T[i];return m};
function pick(K,x,y){let best=null;for(let r=N-1;r>=0;r--)for(let c=N-1;c>=0;c--){const [sx,sy]=iso(r,c),top=sy-H[idx(r,c)]*hz,dx=Math.abs(x-sx)/(tw/2),dy=Math.abs(y-(top+tw/4))/(tw/4);if(dx+dy<=1&&!best)best=[r,c]}return best}
function prism(c,sx,sy,h,col){const top=sy-h*hz;c.fillStyle=col;c.beginPath();c.moveTo(sx,top);c.lineTo(sx+tw/2,top+tw/4);c.lineTo(sx,top+tw/2);c.lineTo(sx-tw/2,top+tw/4);c.closePath();c.fill();
 if(h>0){c.fillStyle='#00000055';c.beginPath();c.moveTo(sx-tw/2,top+tw/4);c.lineTo(sx,top+tw/2);c.lineTo(sx,sy+tw/2);c.lineTo(sx-tw/2,sy+tw/4);c.closePath();c.fill();c.fillStyle='#00000088';c.beginPath();c.moveTo(sx+tw/2,top+tw/4);c.lineTo(sx,top+tw/2);c.lineTo(sx,sy+tw/2);c.lineTo(sx+tw/2,sy+tw/4);c.closePath();c.fill()}}
Salvage({id:'S063',title:'TERRAFORM',parent:'022 READ ONLY GEOLOGY',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE &nbsp;<kbd>SPACE</kbd> RAISE &nbsp;<kbd>X</kbd> LOWER<br>MATCH THE SURVEY IN THE CORNER / HOVER TO READ A COLUMN, CLICK TO RAISE IT (IT WRAPS)',
 aria:'An isometric terrain editor. Arrow keys move a cursor over a grid of columns, Space raises the column and X lowers it. The goal is to make every column match a target survey shown as a coloured map in the corner; mismatched columns are outlined. Hovering with the pointer shows the column height against its target, and clicking raises it, wrapping from the top back to zero.',
 reset(K){layout(K);wins=0;gen(K)},
 resize(K){layout(K)},
 key(K,e,fresh){
  if(e.code==='Space'||e.code==='Enter'){if(fresh)set(K,cur.r,cur.c,1);return true}
  if(e.code==='KeyX'||e.code==='Backspace'||e.code==='ShiftLeft'||e.code==='ShiftRight'){if(fresh)set(K,cur.r,cur.c,-1);return true}
  const d={ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1],ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0]}[e.code];if(d){if(fresh){repeat=.25;cur.r=K.clamp(cur.r+d[0],0,N-1);cur.c=K.clamp(cur.c+d[1],0,N-1)}return true}
 },
 down(K,x,y){const a=pick(K,x,y);if(!a)return false;cur={r:a[0],c:a[1]};const i=idx(a[0],a[1]);if(H[i]>=MAXH){H[i]=0;moves++;if(match()===N*N){wins++;solved=.001;K.note('SURVEY MATCHED')}}else set(K,a[0],a[1],1);return true},
 step(K,dt){
  if(K.keys.size){repeat-=dt;if(repeat<=0){repeat=.1;const d={ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1],ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0]};for(const c of K.keys)if(d[c]){cur.r=K.clamp(cur.r+d[c][0],0,N-1);cur.c=K.clamp(cur.c+d[c][1],0,N-1);break}}}
  if(solved){solved+=dt;if(solved>2.4)gen(K)}
 },
 draw(K,c){
  const {w,h,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  const hv=p.inside?pick(K,p.x,p.y):null;
  for(let s=0;s<2*N-1;s++)for(let r=0;r<N;r++){const cc=s-r;if(cc<0||cc>=N)continue;const i=idx(r,cc),[sx,sy]=iso(r,cc),mis=H[i]!==T[i];prism(c,sx,sy,H[i],pal[H[i]]);
   const top=sy-H[i]*hz;c.strokeStyle=mis?'#ed4e8c66':'#ffffff22';c.beginPath();c.moveTo(sx,top);c.lineTo(sx+tw/2,top+tw/4);c.lineTo(sx,top+tw/2);c.lineTo(sx-tw/2,top+tw/4);c.closePath();c.stroke();
   if((r===cur.r&&cc===cur.c)||(hv&&hv[0]===r&&hv[1]===cc)){c.strokeStyle=r===cur.r&&cc===cur.c?'#faffdb':'#ed4e8c';c.lineWidth=2;c.stroke();c.lineWidth=1}}
  const mx=22,my=h*.28,ms=Math.min(18,w/38);c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('SURVEY',mx,my-10);
  for(let r=0;r<N;r++)for(let q=0;q<N;q++){const i=idx(r,q);c.fillStyle=pal[T[i]];c.fillRect(mx+q*ms,my+r*ms,ms-1,ms-1);if(H[i]===T[i]){c.fillStyle='#05070e';c.fillRect(mx+q*ms+ms*.35,my+r*ms+ms*.35,ms*.3,ms*.3)}else if(r===cur.r&&q===cur.c){c.strokeStyle='#faffdb';c.strokeRect(mx+q*ms-.5,my+r*ms-.5,ms,ms)}}
  const i=idx(cur.r,cur.c);c.fillStyle='#faffdb';c.fillText('HERE '+H[i]+' / TARGET '+T[i],mx,my+N*ms+16);
  if(hv){const j=idx(hv[0],hv[1]);c.fillText('ZONE '+hv[0]+':'+hv[1]+' / '+H[j]+' → '+T[j],p.x+14,p.y-8)}
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.strokeRect(mx-4,my-4,N*ms+8,N*ms+8);c.globalAlpha=1}
 },
 readout:K=>['MATCHED '+K.pad(match(),2)+' / '+N*N,'MOVES '+K.pad(moves)+' / SURVEYS '+K.pad(wins)]
});
})();
</script></body></html>
