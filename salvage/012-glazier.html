<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S012 — GLAZIER</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// The pane went through its afterlife in pieces. A glazier is putting them back, one at a time.
const ref=document.createElement('canvas'),rc=ref.getContext('2d');
let shards=[],sel=-1,setCount=0,cracks=0,whole=0,frame={x:0,y:0,w:1,h:1};
function paint(K){
 const m=Math.min(K.w*.78,K.h*.66*1.5);frame={w:m,h:m/1.5,x:(K.w-m)/2,y:(K.h-m/1.5)/2+6};
 ref.width=Math.round(K.w*K.dpr);ref.height=Math.round(K.h*K.dpr);const c=rc;c.setTransform(K.dpr,0,0,K.dpr,0,0);
 const {x,y,w,h}=frame,g=c.createLinearGradient(x,0,x+w,0);K.SPECTRUM.forEach((s,i)=>g.addColorStop(i/5,s));c.fillStyle=g;c.fillRect(x,y,w,h);
 c.globalCompositeOperation='multiply';for(let i=0;i<40;i++){c.fillStyle='rgba(2,4,26,'+(.15+.25*Math.sin(i*.4+K.seed%9))+')';c.fillRect(x,y+i/40*h,w,h/80)}
 c.globalCompositeOperation='source-over';
 for(let i=0;i<4;i++){c.strokeStyle=i%2?'#f8ffff':'#050912';c.lineWidth=i%2?1.5:6;c.beginPath();c.arc(x+w/2,y+h/2,h*(.2+i*.06),0,K.TAU);c.stroke()}
 c.fillStyle='#f4f8ef';c.font='bold '+Math.round(h*.09)+'px monospace';c.textAlign='center';c.fillText('PLATE GLASS',x+w/2,y+h*.88);c.textAlign='left';
 c.font='9px monospace';c.fillText('028 / AFTERLIFE / '+K.seed.toString(16).toUpperCase(),x+8,y+16);
}
function cut(K){
 const gx=7,gy=5,pts=[];
 for(let j=0;j<=gy;j++)for(let i=0;i<=gx;i++){const edge=i===0||j===0||i===gx||j===gy;pts.push([frame.x+i/gx*frame.w+(edge&&(i===0||i===gx)?0:(K.rand()-.5)*frame.w/gx*.6),frame.y+j/gy*frame.h+(edge&&(j===0||j===gy)?0:(K.rand()-.5)*frame.h/gy*.6)])}
 shards=[];
 for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){const a=j*(gx+1)+i,b=a+1,d=a+gx+1,e=d+1,flip=K.rand()<.5;
  for(const t of flip?[[a,b,e],[a,e,d]]:[[a,b,d],[b,e,d]]){const v=t.map(n=>pts[n]);shards.push({v,cx:(v[0][0]+v[1][0]+v[2][0])/3,cy:(v[0][1]+v[1][1]+v[2][1])/3,dx:0,dy:0,rot:0,vx:0,vy:0,set:true,glint:0})}}
}
function scatter(K,share){
 for(const s of shards)if(K.rand()<share){s.set=false;const tx=K.rand()*K.w*.9+K.w*.05,ty=K.rand()*K.h*.8+K.h*.1;s.dx=(tx-s.cx)*.8;s.dy=(ty-s.cy)*.8;s.rot=(K.rand()-.5)*1.8}
 cracks++;pick(K);
}
function pick(K){const loose=shards.map((s,n)=>n).filter(n=>!shards[n].set);if(!loose.length){sel=-1;return}const cur=sel>=0?shards[sel]:{cx:K.w/2,cy:K.h/2,dx:0,dy:0};loose.sort((a,b)=>Math.hypot(shards[a].cx+shards[a].dx-cur.cx-cur.dx,shards[a].cy+shards[a].dy-cur.cy-cur.dy)-Math.hypot(shards[b].cx+shards[b].dx-cur.cx-cur.dx,shards[b].cy+shards[b].dy-cur.cy-cur.dy));sel=loose.find(n=>n!==sel)??loose[0]}
function under(K,x,y){let best=-1,bd=1e9;shards.forEach((s,n)=>{const d=Math.hypot(s.cx+s.dx-x,s.cy+s.dy-y);if(d<bd){bd=d;best=n}});return bd<Math.min(frame.w/7,frame.h/5)*.7?best:-1}
Salvage({id:'S012',title:'GLAZIER',parent:'028 PLATE GLASS AFTERLIFE',
 help:'<kbd>SPACE</kbd> CHOOSE A LOOSE SHARD &nbsp;<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> CARRY IT HOME<br>THE POINTER REFRACTS / CLICK A SET SHARD TO CRACK IT',
 aria:'A coloured picture on a pane of glass, broken into triangular shards scattered across the screen. Space chooses a loose shard and the arrow keys carry it back to its place, where it straightens and snaps in. The pointer refracts the shard beneath it; clicking a set shard knocks it loose again.',
 reset(K){paint(K);cut(K);cracks=0;setCount=0;whole=0;scatter(K,.55);cracks=0},
 resize(K){paint(K);cut(K);scatter(K,.55)},
 key(K,e,fresh){if(e.code==='Space'||e.code==='Tab'){if(fresh)pick(K);return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 down(K,x,y){const n=under(K,x,y);if(n<0)return false;const s=shards[n];if(s.set){s.set=false;s.vx=(s.cx-x)*4+(K.rand()-.5)*200;s.vy=(s.cy-y)*4-120;s.rot=(K.rand()-.5)*.5;cracks++;K.note('CRACKED / SHARD '+K.pad(n,2))}sel=n;return true},
 step(K,dt){
  let ax=0,ay=0;for(const c of K.keys){if(c==='ArrowLeft'||c==='KeyA')ax--;if(c==='ArrowRight'||c==='KeyD')ax++;if(c==='ArrowUp'||c==='KeyW')ay--;if(c==='ArrowDown'||c==='KeyS')ay++}
  if(sel>=0&&!shards[sel].set){const s=shards[sel];s.vx+=ax*900*dt;s.vy+=ay*900*dt}
  for(const s of shards){
   s.glint=Math.max(0,s.glint-dt*1.2);if(s.set)continue;
   s.vx*=Math.exp(-dt*4);s.vy*=Math.exp(-dt*4);s.dx+=s.vx*dt;s.dy+=s.vy*dt;
   const d=Math.hypot(s.dx,s.dy);
   // Near home, the shard remembers its angle and is drawn in by the putty.
   if(d<70){s.rot*=Math.exp(-dt*(4-d/25));s.dx*=Math.exp(-dt*.8);s.dy*=Math.exp(-dt*.8)}
   if(d<6&&Math.abs(s.rot)<.08){s.set=true;s.dx=s.dy=s.rot=0;s.glint=1;setCount++;K.live('Shard set');if(shards.indexOf(s)===sel)pick(K)}
  }
  if(shards.every(s=>s.set)){whole+=dt;if(whole<dt*1.5)K.note('PANE RESTORED / IT IS STILL GLASS');if(whole>3.5){whole=0;scatter(K,.3);K.note('IT BROKE AGAIN')}}else whole=0;
 },
 draw(K,c){
  const {w,h,pointer:p}=K;c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.strokeStyle='#1d2b3a';c.setLineDash([4,4]);c.strokeRect(frame.x-.5,frame.y-.5,frame.w+1,frame.h+1);c.setLineDash([]);
  const hover=p.inside?under(K,p.x,p.y):-1,order=shards.map((s,n)=>n).sort((a,b)=>(shards[a].set?0:1)-(shards[b].set?0:1)||(a===sel)-(b===sel)||(a===hover)-(b===hover));
  if(sel>=0&&!shards[sel].set){const v=shards[sel].v;c.strokeStyle='#f4d84e';c.globalAlpha=.6;c.setLineDash([3,3]);c.beginPath();c.moveTo(...v[0]);c.lineTo(...v[1]);c.lineTo(...v[2]);c.closePath();c.stroke();c.setLineDash([]);c.globalAlpha=1}
  for(const n of order){
   const s=shards[n],lift=n===hover?1:0,sc=1+lift*.05+(s.set?0:.02);
   c.save();c.translate(s.cx+s.dx,s.cy+s.dy);c.rotate(s.rot);c.scale(sc,sc);c.translate(-s.cx,-s.cy);
   c.beginPath();c.moveTo(...s.v[0]);c.lineTo(...s.v[1]);c.lineTo(...s.v[2]);c.closePath();
   if(!s.set){c.shadowColor='#000';c.shadowBlur=14;c.shadowOffsetY=6;c.fillStyle='#000';c.fill();c.shadowColor='transparent'}
   c.save();c.clip();const rx=lift?(p.x-s.cx-s.dx)*.05:0,ry=lift?(p.y-s.cy-s.dy)*.05:0;c.drawImage(ref,rx,ry,w,h);
   if(lift||s.glint){const g=c.createLinearGradient(s.cx-60,s.cy-60,s.cx+60,s.cy+60);g.addColorStop(0,'#ffffff00');g.addColorStop(.5,'#ffffff'+(s.glint?'aa':'44'));g.addColorStop(1,'#ffffff00');c.fillStyle=g;c.fillRect(s.cx-80,s.cy-80,160,160)}
   c.restore();
   c.strokeStyle=n===sel&&!s.set?'#f4d84e':s.set?'#b5dfea44':'#e9fbffaa';c.lineWidth=n===sel?1.6:.8;c.stroke();c.lineWidth=1;
   c.restore();
  }
  if(sel>=0&&!shards[sel].set){const s=shards[sel];c.font='9px monospace';c.fillStyle='#f4d84e';c.fillText('SHARD '+K.pad(sel,2)+' / '+Math.hypot(s.dx,s.dy).toFixed(0)+'px FROM HOME',s.cx+s.dx+18,s.cy+s.dy-14)}
  if(hover>=0){c.font='8px monospace';c.fillStyle='#faffdb';c.fillText(shards[hover].set?'CLICK TO CRACK':'CLICK TO CHOOSE',p.x+12,p.y+18)}
 },
 readout:K=>['PANE '+(shards.filter(s=>s.set).length/shards.length*100).toFixed(1)+'%','SET '+K.pad(setCount)+' / CRACKS '+K.pad(cracks)]
});
})();
</script></body></html>
