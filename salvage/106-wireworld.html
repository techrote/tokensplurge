<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04070c"><title>S106 — WIREWORLD</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A source that pulses and some lamps that want to flash. Draw the wire between them. The signal does the rest.
const CELL=18;
let cols=0,rows=0,s=null,f=null,t=null,src=[],lamps=[],cur={x:0,y:0},acc=0,tick=0,wins=0,level=0,flashes=null,solved=0,drag=null,penDown=false,rep=0;
const id=(x,y)=>y*cols+x;
function gen(K){cols=Math.min(44,Math.floor(K.w*.92/CELL));rows=Math.min(28,Math.floor(K.h*.72/CELL));s=new Uint8Array(cols*rows);f=new Uint8Array(cols*rows);src=[];lamps=[];solved=0;tick=0;flashes=[];
 for(let k=0;k<cols*rows*.07;k++){const x=Math.floor(K.rand()*cols),y=Math.floor(K.rand()*rows);f[id(x,y)]=3}
 const sy=2+Math.floor(K.rand()*(rows-4));f[id(1,sy)]=1;src.push([1,sy]);s[id(1,sy)]=1;
 const n=Math.min(5,2+Math.floor(level/2));for(let i=0;i<n;i++){let x,y,t0=0;do{x=cols-3-Math.floor(K.rand()*4);y=1+Math.floor(K.rand()*(rows-2));t0++}while((f[id(x,y)]||lamps.some(l=>Math.abs(l[1]-y)<3))&&t0<80);f[id(x,y)]=2;s[id(x,y)]=1;lamps.push([x,y]);flashes.push(0)}
 for(const [x,y] of src.concat(lamps))for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<cols&&b<rows&&f[id(a,b)]===3)f[id(a,b)]=0}
 cur={x:2,y:sy};
}
function step1(K){
 const n=new Uint8Array(s.length);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=id(x,y),v=s[i];if(v===0)continue;if(v===2)n[i]=3;else if(v===3)n[i]=1;else{let h=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<cols&&b<rows&&s[id(a,b)]===2)h++}n[i]=(h===1||h===2)?2:1}}
 tick++;for(const [x,y] of src){if(tick%7===0)n[id(x,y)]=2}
 s=n;lamps.forEach(([x,y],i)=>{if(s[id(x,y)]===2)flashes[i]++});
 if(!solved&&flashes.length&&flashes.every(v=>v>=3)){wins++;solved=.001;K.note('EVERY LAMP LIT / '+K.pad(wins)+' / '+lamps.length+' LAMPS')}
}
function put(K,x,y,v){if(x<0||y<0||x>=cols||y>=rows)return;const i=id(x,y);if(f[i]===3||f[i]===1||f[i]===2)return;s[i]=v}
const ox=K=>(K.w-cols*CELL)/2,oy=K=>(K.h-rows*CELL)/2+8;
const at=(K,x,y)=>{const c=Math.floor((x-ox(K))/CELL),r=Math.floor((y-oy(K))/CELL);return r>=0&&c>=0&&r<rows&&c<cols?{x:c,y:r}:null};
Salvage({id:'S106',title:'WIREWORLD',parent:'029 ORPHANED BUS',bg:'#04070c',
 help:'<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE &nbsp;HOLD <kbd>SPACE</kbd> AND MOVE TO DRAW WIRE &nbsp;HOLD <kbd>X</kbd> TO ERASE<br>LIGHT EVERY LAMP THREE TIMES / DRAG THE POINTER TO DRAW, OR START A DRAG ON A WIRE TO ERASE',
 aria:'A circuit puzzle in the Wireworld cellular automaton. A pulsing source on the left sends electrons along any wire you draw; lamps on the right light each time an electron reaches them. Arrow keys move a cursor; holding Space while moving draws wire and holding X erases it. Dark blocks cannot be built on. Light every lamp three times to finish. With the pointer, dragging over empty cells draws wire and dragging starting on a wire erases it.',
 reset(K){level=0;wins=0;gen(K)},
 resize(K){gen(K)},
 key(K,e,fresh){
  if(e.code==='Space'||e.code==='KeyX'){if(fresh){put(K,cur.x,cur.y,e.code==='Space'?1:0)}return true}
  const d={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[e.code];
  if(d){if(fresh){rep=.2;cur.x=K.clamp(cur.x+d[0],0,cols-1);cur.y=K.clamp(cur.y+d[1],0,rows-1);if(K.keys.has('Space'))put(K,cur.x,cur.y,1);if(K.keys.has('KeyX'))put(K,cur.x,cur.y,0)}return true}
 },
 down(K,x,y){const a=at(K,x,y);if(!a)return false;cur=a;drag=s[id(a.x,a.y)]===1||s[id(a.x,a.y)]>=2&&f[id(a.x,a.y)]===0?0:1;put(K,a.x,a.y,drag);return false},up(){drag=null},
 step(K,dt){
  if(K.keys.size){rep-=dt;if(rep<=0){rep=.07;const d={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};for(const c of K.keys){const v=d[c];if(v){cur.x=K.clamp(cur.x+v[0],0,cols-1);cur.y=K.clamp(cur.y+v[1],0,rows-1);if(K.keys.has('Space'))put(K,cur.x,cur.y,1);if(K.keys.has('KeyX'))put(K,cur.x,cur.y,0);break}}}}
  const p=K.pointer;if(p.held&&drag!==null&&p.inside){const a=at(K,p.x,p.y);if(a){cur=a;put(K,a.x,a.y,drag)}}
  acc+=dt;while(acc>.11){acc-=.11;step1(K)}
  if(solved){solved+=dt;if(solved>2.4){level++;gen(K)}}
 },
 draw(K,c){
  const {w,h,pointer:p}=K,X=ox(K),Y=oy(K);c.fillStyle='#04070c';c.fillRect(0,0,w,h);c.fillStyle='#08111c';c.fillRect(X,Y,cols*CELL,rows*CELL);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=id(x,y),v=s[i],fl=f[i],px=X+x*CELL,py=Y+y*CELL;
   if(fl===3){c.fillStyle='#161e2e';c.fillRect(px+1,py+1,CELL-2,CELL-2);continue}
   if(v===1){c.fillStyle='#e4a23c';c.fillRect(px+3,py+3,CELL-6,CELL-6)}else if(v===2){c.fillStyle='#28e3f4';c.fillRect(px+1,py+1,CELL-2,CELL-2);c.globalAlpha=.3;c.fillRect(px-3,py-3,CELL+6,CELL+6);c.globalAlpha=1}else if(v===3){c.fillStyle='#ed4e8c';c.fillRect(px+3,py+3,CELL-6,CELL-6)}
   if(fl===1){c.strokeStyle='#f4d84e';c.lineWidth=2;c.strokeRect(px+1,py+1,CELL-2,CELL-2);c.lineWidth=1}
   if(fl===2){const li=lamps.findIndex(l=>l[0]===x&&l[1]===y);c.strokeStyle=v===2?'#fff':'#faffdb';c.lineWidth=2;c.beginPath();c.arc(px+CELL/2,py+CELL/2,CELL*.42,0,6.3);c.stroke();c.lineWidth=1;if(v===2){c.fillStyle='#faffdb';c.fill()}c.fillStyle='#faffdb';c.font='9px monospace';c.fillText(Math.min(3,flashes[li])+'/3',px+CELL+4,py+CELL*.7)}}
  const cx=X+cur.x*CELL,cy=Y+cur.y*CELL;c.strokeStyle='#faffdb';c.lineWidth=2;c.strokeRect(cx+1,cy+1,CELL-2,CELL-2);c.lineWidth=1;
  c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('SOURCE PULSES EVERY 7 TICKS / LAMPS '+flashes.filter(v=>v>=3).length+'/'+lamps.length,X,Y-12);
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.strokeRect(X-4,Y-4,cols*CELL+8,rows*CELL+8);c.globalAlpha=1}
 },
 readout:K=>['LAMPS '+flashes.filter(v=>v>=3).length+'/'+lamps.length,'TICK '+K.pad(tick,4)+' / SOLVED '+K.pad(wins)]
});
})();
</script></body></html>
