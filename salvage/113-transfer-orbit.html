<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b"><title>S113 — TRANSFER ORBIT</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// A small world, a smaller moon, and one chance to get a probe from one to the other. The preview already accounts for the moon.
const PR=26,MR=9;
let m=600,GM=1,GMm=1,Rm=180,ph0=0,t=0,ship=null,aim=-.6,power=.5,charging=false,pdir=1,score=0,tries=0,hits=0,best=0,over=0,msg='',msgT=0,tol=75,flight=0,trail=[];
const moon=(tt)=>{const w=2*Math.PI/20;return[Math.cos(ph0+w*tt)*Rm,Math.sin(ph0+w*tt)*Rm]};
function setup(K){m=Math.min(K.w,K.h);GM=6e5*(m/600);Rm=m*.3;GMm=2.4e4;ph0=K.rand()*K.TAU;t=0;ship=null;trail=[]}
const cx=K=>K.w*.32,cy=K=>K.h/2+6;
function accel(x,y,tt){const r2=x*x+y*y,r=Math.sqrt(r2),ax=-GM*x/(r2*r),ay=-GM*y/(r2*r),[mx,my]=moon(tt),dx=mx-x,dy=my-y,d2=dx*dx+dy*dy+MR*MR,d=Math.sqrt(d2);return[ax+GMm*dx/(d2*d),ay+GMm*dy/(d2*d)]}
function path(v,steps){const pts=[];let x=Math.cos(aim)*(PR+3),y=Math.sin(aim)*(PR+3),vx=Math.cos(aim)*v,vy=Math.sin(aim)*v,tt=t;for(let i=0;i<steps;i++){const dt=.04,[ax,ay]=accel(x,y,tt);vx+=ax*dt;vy+=ay*dt;x+=vx*dt;y+=vy*dt;tt+=dt;pts.push([x,y]);if(Math.hypot(x,y)<PR)break;const [mx,my]=moon(tt);if(Math.hypot(x-mx,y-my)<MR*2.4)break}return pts}
function launch(K){if(ship||over)return;const v=110+power*220;ship={x:Math.cos(aim)*(PR+3),y:Math.sin(aim)*(PR+3),vx:Math.cos(aim)*v,vy:Math.sin(aim)*v,t0:t};tries++;flight=0;trail=[]}
Salvage({id:'S113',title:'TRANSFER ORBIT',parent:'029 ORPHANED BUS',bg:'#03050b',scanlines:false,
 help:'<kbd>←</kbd><kbd>→</kbd> AIM &nbsp;HOLD <kbd>SPACE</kbd> TO CHARGE, RELEASE TO LAUNCH<br>ARRIVE AT THE MOON GENTLY ENOUGH TO BE CAPTURED / THE POINTER AIMS AND HOLD-RELEASE LAUNCHES',
 aria:'A gravity transfer puzzle. A planet sits on the left with a small moon orbiting it. Left and right arrows aim a probe, holding Space charges the launch speed and releasing fires it. The dotted preview shows the path including the moon\'s pull. The goal is to reach the moon at a low relative speed so it is captured. Crashing into the planet or flying off the screen wastes the launch. The pointer aims the probe, and holding and releasing it launches.',
 reset(K){setup(K);score=tries=hits=best=0;over=0;tol=75},
 resize(K){setup(K)},
 key(K,e,fresh){if(e.code==='Space'){if(fresh&&!ship){charging=true;power=0;pdir=1}return true}if(/^Arrow|^Key[WASD]$/.test(e.code))return true},
 keyup(K,e){if(e.code==='Space'&&charging){charging=false;launch(K)}},
 down(K,x,y){if(!ship){charging=true;power=0;pdir=1}return false},up(K){if(charging){charging=false;launch(K)}},
 step(K,dt){
  t+=dt;const d=(K.keys.has('ArrowRight')||K.keys.has('KeyD')||K.keys.has('ArrowDown')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')||K.keys.has('ArrowUp')?1:0);aim+=d*dt*1.1;
  const p=K.pointer;if(p.inside&&!ship&&(p.speed>.03||p.held))aim=Math.atan2(p.y-cy(K),p.x-cx(K));
  if(charging){power+=pdir*dt*.8;if(power>=1){power=1;pdir=-1}if(power<=0){power=0;pdir=1}}
  msgT=Math.max(0,msgT-dt);
  if(ship){flight+=dt;const n=4;for(let s=0;s<n;s++){const h=dt/n,[ax,ay]=accel(ship.x,ship.y,t);ship.vx+=ax*h;ship.vy+=ay*h;ship.x+=ship.vx*h;ship.y+=ship.vy*h}
   trail.push([ship.x,ship.y]);if(trail.length>220)trail.shift();const [mx,my]=moon(t),dm=Math.hypot(ship.x-mx,ship.y-my);
   if(dm<MR*2.6){const mvx=-Math.sin(ph0+2*Math.PI/20*t)*Rm*2*Math.PI/20,mvy=Math.cos(ph0+2*Math.PI/20*t)*Rm*2*Math.PI/20,rel=Math.hypot(ship.vx-mvx,ship.vy-mvy);
    if(rel<tol){hits++;score+=Math.round(100+(tol-rel)*2);best=Math.max(best,score);msg='CAPTURED / RELATIVE SPEED '+rel.toFixed(0);K.note(msg);tol=Math.max(35,tol-5);ph0=K.rand()*K.TAU;ship=null}else{msg='TOO FAST / '+rel.toFixed(0)+' vs '+tol;K.note('FLEW PAST / RELATIVE SPEED '+rel.toFixed(0)+' (NEED < '+tol+')');ship=null}msgT=2}
   else if(Math.hypot(ship.x,ship.y)<PR){K.note('CRASHED INTO THE PLANET');ship=null}else if(Math.hypot(ship.x,ship.y)>m*1.5||flight>30){K.note('LOST TO SPACE');ship=null}}
 },
 draw(K,c){
  const {w,h,TAU,pointer:p}=K,X=cx(K),Y=cy(K);c.fillStyle='#03050b';c.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){c.globalAlpha=.15+K.hash(i)*.4;c.fillStyle='#b7f6ff';c.fillRect(K.hash(i*3.1)*w,K.hash(i*7.3)*h,1.3,1.3)}c.globalAlpha=1;
  c.strokeStyle='#10202e';c.setLineDash([2,6]);c.beginPath();c.arc(X,Y,Rm,0,TAU);c.stroke();c.setLineDash([]);
  const g=c.createRadialGradient(X,Y,PR*.3,X,Y,PR*1.4);g.addColorStop(0,'#28e3f4');g.addColorStop(.7,'#1d6fe0');g.addColorStop(1,'#1d6fe000');c.fillStyle=g;c.beginPath();c.arc(X,Y,PR*1.4,0,TAU);c.fill();c.fillStyle='#1d3a7a';c.beginPath();c.arc(X,Y,PR,0,TAU);c.fill();c.strokeStyle='#28e3f4';c.stroke();
  const [mx,my]=moon(t);c.fillStyle='#cfd6dc';c.beginPath();c.arc(X+mx,Y+my,MR,0,TAU);c.fill();c.strokeStyle='#faffdb55';c.beginPath();c.arc(X+mx,Y+my,MR*2.6,0,TAU);c.stroke();c.font='8px monospace';c.fillStyle='#9fc4d6';c.fillText('MOON',X+mx+MR+8,Y+my+3);
  if(!ship){const pts=path(110+Math.max(.25,power)*220,160);c.fillStyle='#faffdb';pts.forEach(([x,y],i)=>{if(i%3===0){c.globalAlpha=.7*(1-i/pts.length)+.1;c.fillRect(X+x-1.5,Y+y-1.5,3,3)}});c.globalAlpha=1;
   c.strokeStyle='#faffdb';c.lineWidth=2;c.beginPath();c.moveTo(X+Math.cos(aim)*PR,Y+Math.sin(aim)*PR);c.lineTo(X+Math.cos(aim)*(PR+14),Y+Math.sin(aim)*(PR+14));c.stroke();c.lineWidth=1}
  else{trail.forEach(([x,y],i)=>{c.globalAlpha=i/trail.length*.6;c.fillStyle='#faffdb';c.fillRect(X+x-1,Y+y-1,2,2)});c.globalAlpha=1;c.fillStyle='#fff';c.beginPath();c.arc(X+ship.x,Y+ship.y,3.5,0,TAU);c.fill()}
  c.fillStyle='#ffffff22';c.fillRect(X-40,Y+PR+34,80,4);c.fillStyle=power>.85?'#ed4e8c':'#faffdb';c.fillRect(X-40,Y+PR+34,80*power,4);c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('LAUNCH SPEED '+(110+power*220).toFixed(0),X-40,Y+PR+28);c.fillText('CAPTURE NEEDS RELATIVE SPEED < '+tol,w*.55,h*.12);
  if(msgT>0){c.globalAlpha=Math.min(1,msgT);c.fillStyle='#faffdb';c.fillText(msg,w*.55,h*.12+16);c.globalAlpha=1}
  if(p.inside&&!ship){c.globalAlpha=.5;c.strokeStyle='#faffdb';c.beginPath();c.arc(p.x,p.y,8,0,TAU);c.stroke();c.globalAlpha=1;c.fillText(p.held?'CHARGING':'AIMING',p.x+12,p.y-8)}
 },
 readout:K=>['CAPTURES '+K.pad(hits)+' / TRIES '+K.pad(tries),'SCORE '+K.pad(score,5)+' / NEED < '+tol]
});
})();
</script></body></html>
