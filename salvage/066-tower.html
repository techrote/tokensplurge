<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S066 — TOWER</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// Move the stack to the right-hand peg, one disk at a time, never putting a larger disk on a smaller one.
let n=3,pegs=[[],[],[]],sel=0,held=null,moves=0,wins=0,level=0,solved=0,shake=0,best=0,anim=[];
function setup(){pegs=[[],[],[]];for(let i=n;i>=1;i--)pegs[0].push(i);held=null;moves=0;solved=0;sel=0}
const geo=K=>{const pw=Math.min(K.w*.26,260),x=[K.w/2-pw,K.w/2,K.w/2+pw],base=K.h*.72,dh=Math.min(26,K.h*.05),dw=Math.min(pw*.45,90);return{x,base,dh,dw,top:K.h*.3}};
function act(K,p){
 if(solved)return;sel=p;
 if(held===null){if(pegs[p].length){held=pegs[p].pop();held=held}else{shake=.3}}
 else{const top=pegs[p][pegs[p].length-1];if(top!==undefined&&top<held){shake=.3;K.note('A LARGER DISK CANNOT SIT ON A SMALLER ONE');return}
  const from=held;pegs[p].push(held);held=null;moves++;if(pegs[2].length===n){wins++;solved=.001;const opt=Math.pow(2,n)-1;best=best?Math.min(best,moves-opt):moves-opt;K.note('MOVED IN '+moves+' / OPTIMUM '+opt)}}
}
Salvage({id:'S066',title:'TOWER',parent:'012 RECOVERING THE RECOVERY',
 help:'<kbd>←</kbd><kbd>→</kbd> CHOOSE A PEG &nbsp;<kbd>SPACE</kbd> LIFT OR PLACE THE TOP DISK<br>MOVE THE STACK TO THE RIGHT / HOVER A PEG TO SEE IF IT FITS, CLICK TO ACT',
 aria:'The Tower of Hanoi puzzle with three pegs and a stack of coloured disks. Left and right arrows choose a peg and Space lifts the top disk from it or places the held disk on it. A larger disk may never rest on a smaller one. Move the whole stack to the right peg in as few moves as possible. The pointer highlights whether the held disk fits on a peg and clicking acts on it.',
 reset(K){n=3;level=0;wins=0;best=0;setup()},
 key(K,e,fresh){
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'||e.code==='KeyS'){if(fresh)act(K,sel);return true}
  if(fresh&&(e.code==='ArrowLeft'||e.code==='KeyA')){sel=Math.max(0,sel-1);return true}
  if(fresh&&(e.code==='ArrowRight'||e.code==='KeyD')){sel=Math.min(2,sel+1);return true}
  if(e.code==='ArrowUp'||e.code==='KeyW')return true;
 },
 down(K,x,y){const g=geo(K);let p=-1,bd=1e9;g.x.forEach((px,i)=>{const d=Math.abs(px-x);if(d<bd){bd=d;p=i}});if(y<g.top-60||y>g.base+60)return false;act(K,p);return true},
 step(K,dt){shake=Math.max(0,shake-dt);if(solved){solved+=dt;if(solved>2.2){n=Math.min(8,n+1);setup()}}},
 draw(K,c){
  const {w,h,pointer:p}=K,g=geo(K);c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.fillStyle='#0c1420';c.fillRect(g.x[0]-g.dw-30,g.base,g.x[2]-g.x[0]+g.dw*2+60,8);
  const hv=p.inside&&p.y>g.top-60&&p.y<g.base+60?g.x.reduce((b,x,i)=>Math.abs(x-p.x)<Math.abs(g.x[b]-p.x)?i:b,0):-1;
  for(let i=0;i<3;i++){const ok=held===null?pegs[i].length>0:(pegs[i].length===0||pegs[i][pegs[i].length-1]>held);const hl=i===sel,hh=i===hv;c.fillStyle=i===2?'#2a3d5e':'#17283a';c.fillRect(g.x[i]-4,g.top,8,g.base-g.top);
   if(hl||hh){c.strokeStyle=hh?(ok?'#10f4cf':'#ed4e8c'):'#faffdb';c.lineWidth=2;c.strokeRect(g.x[i]-g.dw-14,g.top-26,g.dw*2+28,g.base-g.top+30);c.lineWidth=1}
   pegs[i].forEach((d,k)=>{const dw=g.dw*(.35+d/n*.65),x=g.x[i]-dw+(shake&&i===sel?Math.sin(K.time*80)*3:0),y=g.base-(k+1)*g.dh;c.fillStyle=K.SPECTRUM[(d-1)%6];c.fillRect(x,y,dw*2,g.dh-2);c.strokeStyle='#ffffff55';c.strokeRect(x+.5,y+.5,dw*2-1,g.dh-3);c.fillStyle='#05070e';c.font='9px monospace';c.textAlign='center';c.fillText(d,g.x[i],y+g.dh*.65);c.textAlign='left'});
   c.fillStyle=i===2?'#f4d84e':'#9fc4d6';c.font='9px monospace';c.textAlign='center';c.fillText(i===2?'TARGET':i===0?'START':'SPARE',g.x[i],g.base+26);c.textAlign='left'}
  if(held!==null){const dw=g.dw*(.35+held/n*.65),x=g.x[sel]-dw,y=g.top-g.dh-18+Math.sin(K.time*6)*2;c.fillStyle=K.SPECTRUM[(held-1)%6];c.fillRect(x,y,dw*2,g.dh-2);c.strokeStyle='#faffdb';c.strokeRect(x+.5,y+.5,dw*2-1,g.dh-3)}
  c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText(n+' DISKS / OPTIMUM '+(Math.pow(2,n)-1),g.x[0]-g.dw,g.top-44);
 },
 readout:K=>['MOVES '+K.pad(moves,3)+' / OPT '+K.pad(Math.pow(2,n)-1,3),'DISKS '+n+' / SOLVED '+K.pad(wins)]
});
})();
</script></body></html>
