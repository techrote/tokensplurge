<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>S087 — CHROMA MATCH</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// The colour you are matching is drifting, slowly, the way a stored picture does. Mix a swatch to follow it.
let tgt=[128,128,128],mine=[40,40,40],sel=0,tol=.09,wins=0,holdT=0,drift=[0,0,0],diff=1,solved=0,level=0,repeat=0,split=false,streak=0;
const CH=['RED','GREEN','BLUE'],CC=['#ed4e8c','#10f4cf','#28e3f4'];
const dist=()=>Math.hypot(tgt[0]-mine[0],tgt[1]-mine[1],tgt[2]-mine[2])/441.7;
function newT(K){tgt=[40+K.rand()*180,40+K.rand()*180,40+K.rand()*180];drift=[0,1,2].map(()=>(K.rand()-.5)*10*(1+level*.25));mine=[128,128,128];holdT=0;solved=0;tol=Math.max(.025,.09-level*.007)}
const geo=K=>{const sw=Math.min(K.w*.34,300),sx=K.w/2-sw-20,sy=K.h*.2;return{sw,sx,sy,sh:Math.min(K.h*.3,220),bx:K.w/2+20,by:K.h*.24,bw:Math.min(K.w*.32,280)}};
const sl=(K,i)=>{const g=geo(K);return{x:g.sx,y:g.sy+g.sh+90+i*38,w:g.sw*2+40}};
const rgb=a=>'rgb('+a.map(v=>Math.round(v)).join(',')+')';
Salvage({id:'S087',title:'CHROMA MATCH',parent:'014 FALSE COLOUR NECROSIS',
 help:'<kbd>↑</kbd><kbd>↓</kbd> CHOOSE A CHANNEL &nbsp;<kbd>←</kbd><kbd>→</kbd> ADJUST IT (HOLD TO SPEED UP)<br>FOLLOW THE DRIFTING TARGET AND HOLD THE MATCH / DRAG THE SLIDERS, HOVER THE SWATCHES TO SPLIT THEM',
 aria:'A colour-matching game. A target colour slowly drifts, and you mix your own swatch with red, green and blue sliders. Up and down arrows choose a channel and left and right adjust it, accelerating when held. When the difference falls inside a tolerance and stays there for a second, the match counts; tolerance shrinks and drift grows with each level. Dragging the sliders with the pointer works too, and hovering over a swatch splits the two for comparison.',
 reset(K){level=0;wins=0;streak=0;newT(K)},
 key(K,e,fresh){
  if(fresh&&(e.code==='ArrowUp'||e.code==='KeyW')){sel=(sel+2)%3;return true}if(fresh&&(e.code==='ArrowDown'||e.code==='KeyS')){sel=(sel+1)%3;return true}
  if(/^Arrow|^Key[WASD]$|^Space$/.test(e.code))return true;
 },
 down(K,x,y){for(let i=0;i<3;i++){const q=sl(K,i);if(x>=q.x-8&&x<=q.x+q.w+8&&y>=q.y-16&&y<=q.y+22){sel=i;mine[i]=K.clamp((x-q.x)/q.w,0,1)*255;return false}}return false},
 step(K,dt){
  const g=geo(K),p=K.pointer,d=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0);
  repeat=d?repeat+dt:0;if(d)mine[sel]=K.clamp(mine[sel]+d*dt*(40+Math.min(260,repeat*260)),0,255);
  if(p.held&&p.inside){const q=sl(K,sel);if(p.y>=q.y-30&&p.y<=q.y+40)mine[sel]=K.clamp((p.x-q.x)/q.w,0,1)*255}
  if(!solved){for(let i=0;i<3;i++){tgt[i]+=drift[i]*dt;if(tgt[i]<20||tgt[i]>235){drift[i]*=-1;tgt[i]=K.clamp(tgt[i],20,235)}}}
  diff=dist();split=p.inside&&p.x>g.sx&&p.x<g.sx+g.sw*2+40&&p.y>g.sy&&p.y<g.sy+g.sh;
  if(!solved){if(diff<tol){holdT+=dt;if(holdT>1){wins++;streak++;level++;solved=.001;K.note('MATCHED / ΔE '+(diff*100).toFixed(1)+'% / LEVEL '+K.pad(level+1))}}else{holdT=Math.max(0,holdT-dt*2)}}
  else{solved+=dt;if(solved>1.8)newT(K)}
 },
 draw(K,c){
  const {w,h,pointer:p}=K,g=geo(K);c.fillStyle='#05070e';c.fillRect(0,0,w,h);
  c.fillStyle=rgb(tgt);c.fillRect(g.sx,g.sy,g.sw,g.sh);c.fillStyle=rgb(mine);c.fillRect(g.sx+g.sw+40,g.sy,g.sw,g.sh);
  if(split){c.fillStyle=rgb(tgt);c.fillRect(g.sx+g.sw+40,g.sy,g.sw/2,g.sh);c.fillStyle=rgb(mine);c.fillRect(g.sx+g.sw/2,g.sy,g.sw/2,g.sh);c.strokeStyle='#faffdb';c.strokeRect(g.sx+g.sw/2+.5,g.sy+.5,g.sw/2+40+g.sw/2,g.sh)}
  c.strokeStyle='#2a3d5e';c.strokeRect(g.sx+.5,g.sy+.5,g.sw,g.sh);c.strokeRect(g.sx+g.sw+40.5,g.sy+.5,g.sw,g.sh);c.font='9px monospace';c.fillStyle='#9fc4d6';c.fillText('TARGET (DRIFTING)',g.sx,g.sy-8);c.fillText('YOURS',g.sx+g.sw+40,g.sy-8);c.fillText(split?'SPLIT VIEW':'',g.sx+g.sw-10,g.sy+g.sh+14);
  c.fillStyle='#ffffff22';c.fillRect(g.sx,g.sy+g.sh+24,g.sw*2+40,6);c.fillStyle=diff<tol?'#f4d84e':'#10f4cf';c.fillRect(g.sx,g.sy+g.sh+24,(g.sw*2+40)*Math.max(0,1-diff/.35),6);c.fillStyle='#faffdb';const tx=g.sx+(g.sw*2+40)*Math.max(0,1-tol/.35);c.fillRect(tx-1,g.sy+g.sh+20,2,14);c.fillText('ΔE '+(diff*100).toFixed(1)+'% / TOLERANCE '+(tol*100).toFixed(1)+'%',g.sx,g.sy+g.sh+48);
  for(let i=0;i<3;i++){const yy=g.by+i*70+g.sh+90;}
  const base=g.sy+g.sh+90;for(let i=0;i<3;i++){const yy=base+i*38,on=i===sel,sx=g.bx-(g.bx-g.sx)+0;const bx=g.sx,bw=g.sw*2+40;c.fillStyle='#0c1420';c.fillRect(bx,yy,bw,10);const gr=c.createLinearGradient(bx,0,bx+bw,0);const a=mine.slice(),b=mine.slice();a[i]=0;b[i]=255;gr.addColorStop(0,rgb(a));gr.addColorStop(1,rgb(b));c.fillStyle=gr;c.fillRect(bx,yy,bw,10);c.strokeStyle=on?'#faffdb':'#2a3d5e';c.lineWidth=on?2:1;c.strokeRect(bx-.5,yy-.5,bw+1,11);c.lineWidth=1;const kx=bx+mine[i]/255*bw;c.fillStyle='#fff';c.fillRect(kx-3,yy-5,6,20);c.fillStyle=CC[i];c.font='9px monospace';c.fillText(CH[i]+' '+Math.round(mine[i])+(on?' ◄':''),bx,yy-8);
   c.fillStyle='#ffffff55';c.fillRect(bx+tgt[i]/255*bw-1,yy-3,2,16)}
  if(solved){c.globalAlpha=.3+.2*Math.sin(K.time*8);c.strokeStyle='#faffdb';c.lineWidth=2;c.strokeRect(g.sx-6,g.sy-6,g.sw*2+52,g.sh+12);c.lineWidth=1;c.globalAlpha=1}
  if(p.inside){c.fillStyle='#faffdb';c.fillText(split?'SPLIT':'',p.x+12,p.y-8)}
 },
 readout:K=>['ΔE '+(diff*100).toFixed(1)+'% / TOL '+(tol*100).toFixed(1)+'%','MATCHED '+K.pad(wins)+' / LEVEL '+K.pad(level+1)+' / HOLD '+holdT.toFixed(1)+'s']
});
})();
</script></body></html>
