<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04060c"><title>S071 — CORRIDOR</title><script src="kit.js"></script></head><body>
<script>
(()=>{'use strict';
// First-person, no map. The walls take their colour from wherever you struck them.
let M=8,grid=null,px=1.5,py=1.5,ang=0,exit={x:0,y:0},level=0,wins=0,steps=0,seen=null,lastLook=null,bob=0,flash=0;
const W=()=>2*M+1;
function gen(K){
 M=Math.min(15,6+level*1.5|0);const S=2*M+1;grid=new Uint8Array(S*S).fill(1);seen=new Uint8Array(S*S);const st=[[1,1]];grid[S+1]=0;
 while(st.length){const [x,y]=st[st.length-1],o=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<S-1&&ny<S-1&&grid[ny*S+nx]});
  if(!o.length){st.pop();continue}const [dx,dy]=o[Math.floor(K.rand()*o.length)];grid[(y+dy/2)*S+x+dx/2]=0;grid[(y+dy)*S+x+dx]=0;st.push([x+dx,y+dy])}
 px=1.5;py=1.5;ang=Math.atan2(1,0)*(K.rand()<.5?0:1);for(let a=0;a<4;a++){const t=a*Math.PI/2;if(grid[Math.floor(py+Math.sin(t))*S+Math.floor(px+Math.cos(t))]===0){ang=t;break}}
 exit={x:S-2,y:S-2};steps=0;flash=0;
}
const wall=(x,y)=>{const S=W();return x<0||y<0||x>=S||y>=S||grid[Math.floor(y)*S+Math.floor(x)]===1};
Salvage({id:'S071',title:'CORRIDOR',parent:'009 AN INTERIOR FOR NOTHING',bg:'#04060c',
 help:'<kbd>←</kbd><kbd>→</kbd> TURN &nbsp;<kbd>↑</kbd><kbd>↓</kbd> WALK &nbsp;FIND THE LIGHT AT THE FAR CORNER<br>HOLD THE POINTER AND DRAG LEFT OR RIGHT TO LOOK AROUND',
 aria:'A first-person maze drawn with raycasting. Up and down arrows walk forward and back, left and right turn. Walls are coloured by position and dim with distance; a bright marker shows the exit in the far corner. Holding the pointer and moving it sideways turns the view. A small map in the corner shows the cells you have visited. Reaching the exit starts a larger maze.',
 reset(K){level=0;wins=0;gen(K)},
 key(K,e,fresh){if(/^Arrow|^Key[WASD]$/.test(e.code)||e.code==='Space')return true},
 up(K){lastLook=null},
 step(K,dt){
  const S=W(),turn=(K.keys.has('ArrowRight')||K.keys.has('KeyD')?1:0)-(K.keys.has('ArrowLeft')||K.keys.has('KeyA')?1:0),mv=(K.keys.has('ArrowUp')||K.keys.has('KeyW')?1:0)-(K.keys.has('ArrowDown')||K.keys.has('KeyS')?1:0);
  ang+=turn*2.2*dt;const p=K.pointer;if(p.held&&p.inside){if(lastLook!==null)ang+=(p.x-lastLook)*.006;lastLook=p.x}else lastLook=null;
  if(mv){const sp=2.2*dt*mv,nx=px+Math.cos(ang)*sp,ny=py+Math.sin(ang)*sp,m=.2;if(!wall(nx+Math.sign(Math.cos(ang)*mv)*m,py))px=nx;if(!wall(px,ny+Math.sign(Math.sin(ang)*mv)*m))py=ny;bob+=dt*9;steps+=Math.abs(sp)}
  seen[Math.floor(py)*S+Math.floor(px)]=1;if(Math.floor(px)===exit.x&&Math.floor(py)===exit.y){wins++;K.note('LIGHT REACHED / '+K.pad(wins)+' / THE CORRIDOR LENGTHENS');level++;gen(K)}
 },
 draw(K,c){
  const {w,h}=K,S=W(),horizon=h/2+Math.sin(bob)*3,cols=Math.ceil(w/3),fov=Math.PI/2.4;
  const sky=c.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#04060c');sky.addColorStop(1,'#10182c');c.fillStyle=sky;c.fillRect(0,0,w,horizon);const fl=c.createLinearGradient(0,horizon,0,h);fl.addColorStop(0,'#0b0f1c');fl.addColorStop(1,'#1a1428');c.fillStyle=fl;c.fillRect(0,horizon,w,h-horizon);
  for(let i=0;i<cols;i++){
   const ca=ang+(i/cols-.5)*fov,dx=Math.cos(ca),dy=Math.sin(ca);let mx=Math.floor(px),my=Math.floor(py);const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);let sx,sy,sdx,sdy;
   if(dx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}if(dy<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
   let side=0,hit=false,guard=0;while(!hit&&guard++<60){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(mx<0||my<0||mx>=S||my>=S||grid[my*S+mx]===1)hit=true}
   let dist=side?(my-py+(1-sy)/2)/dy:(mx-px+(1-sx)/2)/dx;dist=Math.max(.05,dist*Math.cos(ca-ang));
   const lh=Math.min(h*1.6,h/dist),y0=horizon-lh/2,wx=side?px+dist*dx/Math.cos(ca-ang):py+dist*dy/Math.cos(ca-ang),tex=wx-Math.floor(wx),band=Math.floor(tex*12)%2,shade=Math.max(.06,1-dist/9)*(side?.7:1);
   const hue=(mx*37+my*61+(side?90:0))%360;c.fillStyle='hsl('+hue+','+(55+band*15)+'%,'+Math.round(shade*(band?32:26)+4)+'%)';c.fillRect(i*3,y0,3.2,lh);c.fillStyle='rgba(0,0,0,'+(.35*shade+.1)+')';for(let k=1;k<5;k++)c.fillRect(i*3,y0+lh*k/5,3.2,Math.max(1,lh*.012));
   if(mx===exit.x&&my===exit.y){c.fillStyle='rgba(244,216,78,'+shade+')';c.fillRect(i*3,y0,3.2,lh)}
  }
  // The exit glows through the fog even when hidden behind walls.
  const ex=exit.x+.5-px,ey=exit.y+.5-py,ea=Math.atan2(ey,ex),rel=((ea-ang+Math.PI*3)%(Math.PI*2))-Math.PI,d=Math.hypot(ex,ey);
  if(Math.abs(rel)<fov/2){const sx=(rel/fov+.5)*w;c.globalAlpha=.5*Math.min(1,3/d);const g2=c.createRadialGradient(sx,horizon,0,sx,horizon,60);g2.addColorStop(0,'#f4d84e');g2.addColorStop(1,'#f4d84e00');c.fillStyle=g2;c.fillRect(sx-60,horizon-60,120,120);c.globalAlpha=1}
  const ms=Math.max(3,Math.min(8,100/S)),mx0=w-S*ms-22,my0=70;c.globalAlpha=.8;for(let y=0;y<S;y++)for(let x=0;x<S;x++){if(seen[y*S+x]){c.fillStyle=grid[y*S+x]?'#2a3d5e':'#10202e';c.fillRect(mx0+x*ms,my0+y*ms,ms,ms)}}
  c.fillStyle='#faffdb';c.beginPath();c.arc(mx0+px*ms,my0+py*ms,2,0,Math.PI*2);c.fill();c.strokeStyle='#faffdb';c.beginPath();c.moveTo(mx0+px*ms,my0+py*ms);c.lineTo(mx0+(px+Math.cos(ang)*1.5)*ms,my0+(py+Math.sin(ang)*1.5)*ms);c.stroke();c.fillStyle='#f4d84e';c.fillRect(mx0+exit.x*ms,my0+exit.y*ms,ms,ms);c.globalAlpha=1;
  c.font='9px monospace';c.fillStyle='#faffdb';c.textAlign='center';c.fillText('HEADING '+((ang*180/Math.PI%360+360)%360).toFixed(0)+'° / '+(K.pointer.held?'LOOKING':''),w/2,h-62);c.textAlign='left';
 },
 readout:K=>['LEVEL '+K.pad(level+1),'REACHED '+K.pad(wins)+' / STEPS '+K.pad(steps,4)]
});
})();
</script></body></html>
