name: CyberSand source-pinned reference captures

on:
  push:
    branches:
      - 'docs/cybersand-reference-library-*'
    paths:
      - 'references/cybersand/**'
      - '.github/workflows/cybersand-reference-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybersand-reference-capture-lightweight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Test immutable per-entry references and adversarial mixed revisions
        run: node references/cybersand/tools/test-policy.cjs
      - name: Capture or reuse exact-revision artwork and verify PNGs
        run: |
          if node references/cybersand/tools/verify.cjs --require-captures; then
            echo "Source-pinned captures already verified; no nondeterministic recapture needed."
          else
            node references/cybersand/tools/capture.cjs
            node references/cybersand/tools/verify.cjs --require-captures
          fi
      - name: Browser-smoke the selected environment across desktop and mobile
        run: node references/cybersand/tools/smoke-selected-art.cjs
      - name: Browser-smoke the newly curated source on actual desktop and mobile Canvas pixels
        run: node references/cybersand/tools/smoke-thirst-art.cjs
      - name: Browser-smoke the new source-pinned living-architecture artwork
        run: node references/cybersand/tools/smoke-citadel-art.cjs
      - name: Browser-smoke the single-file moodboard and filters
        run: node references/cybersand/tools/smoke-ui.cjs
      - name: Commit only capture assets to the isolated documentation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/cybersand/captures references/cybersand/catalogue.json references/cybersand/index.html
          if git diff --cached --quiet; then
            echo "No capture changes"
            exit 0
          fi
          git commit -m "docs: add source-pinned Chromium reference captures [skip ci]"
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            git rebase --abort
            echo "Docs branch advanced with conflicting capture changes; leave it untouched and retry from a fresh head." >&2
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Preserve capture report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cybersand-capture-diagnostics
          path: references/cybersand/captures/
          if-no-files-found: ignore
          retention-days: 14
