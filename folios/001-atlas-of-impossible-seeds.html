 if(mobile){txt('No. 00'+(active+1)+'    '+names[active],x+pw*.08,y+ph*.885,Math.min(11,pw*.025),ink,'left','monospace');txt(common[active],x+pw*.08,y+ph*.926,Math.min(16,pw*.046),'#6b4d43','left','Georgia');txt(epigraph[active],x+pw*.08,y+ph*.966,Math.min(8,pw*.021),night?'#314a4e':'#807160','left','Georgia');}
 else {
 for(let i=0;i<3;i++){let xx=x+pw*(.19+i*.31),ww=pw*.29;txt('FIG. 0'+(i+1),xx,y+ph*.165,10,ink,'center','monospace');txt(names[i],xx,y+ph*.883,Math.min(14,pw*.012),ink,'center','Georgia');txt(descriptions[i],xx,y+ph*.921,Math.min(9,pw*.008),night?'#304c50':'#7a6953','center','monospace');
 if(i<2){setLine(night?'#5d7272':'#b9a788',.7,.65);line(x+pw*(.344+i*.31),y+ph*.18,x+pw*(.344+i*.31),y+ph*.79);}}
 }
 ctx.restore();}
function drawArt(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;backdrop(t);const p=layout;paper(p.x,p.y,p.w,p.h);
 ctx.save();ctx.beginPath();ctx.rect(p.x+15,p.y+15,p.w-30,p.h-30);ctx.clip();
 const baseline=p.y+p.h*.792;const maxScale=mobile?Math.min(p.w/255,p.h/535):Math.min(p.w/1130,p.h/605);const scale=mobile?maxScale*.83:maxScale*.95;
 if(mobile){drawnPlant(active,p.x+p.w*.5,baseline,scale,t,flowers?1:.22);guide(p.x+p.w*.18,p.y+p.h*.81,p.w*.64,'SCALE  /  1 : ∞');}
 else {
 const centers=[.19,.5,.81];for(let i=0;i<3;i++){let sx=p.x+p.w*centers[i],sel=(pointer===i);ctx.save();if(sel){let g=ctx.createRadialGradient(sx,baseline-p.h*.32,10,sx,baseline-p.h*.32,p.w*.18);g.addColorStop(0,night?'#e5d8a11d':'#fff8d44b');g.addColorStop(1,'#fff8d400');ctx.fillStyle=g;ctx.fillRect(sx-p.w*.18,p.y+30,p.w*.36,p.h*.78)}ctx.restore();
 drawnPlant(i,sx,baseline,scale,t,flowers?1:.22);guide(sx-p.w*.115,p.y+p.h*.807,p.w*.23,'1 : ∞');}
 }
 ctx.restore();plateDecor(p,t);
 if(!mobile){txt('The flora of places never found',w*.5,p.y-25,Math.min(14,w*.012),'#d3c5a9','center','Georgia');txt('EXAMINE · ILLUMINATE · PRESERVE',w*.5,p.y+p.h+26,11,'#b7a98d','center','monospace');}
 else txt('VOLUME I  /  THREE IMPOSSIBLE GENERA',w*.5,p.y-12,Math.min(10,w*.025),'#d6c3a7','center','monospace');
}
function render(now){let dt=last?Math.min(.04,(now-last)/1000):0;last=now;if(!frozen)elapsed+=dt;if(!frozen||invalid){drawArt(elapsed);invalid=false}requestAnimationFrame(render)}
function status(s){document.getElementById('live').textContent=s}
function toggleNight(){night=!night;document.getElementById('light').textContent=night?'DAYLIGHT':'NOCTURNE';status(night?'Moonlight edition':'Daylight edition');invalid=true}
function toggleBloom(){flowers=!flowers;document.getElementById('bloom').textContent=flowers?'IN FLOWER':'DORMANT';document.getElementById('bloom').classList.toggle('active',flowers);status(flowers?'Specimens in flower':'Specimens dormant');invalid=true}
function changeActive(n){active=(n+3)%3;status(names[active]+' — '+common[active]);invalid=true}
function save(){drawArt(elapsed);let a=document.createElement('a');a.download='atlas-impossible-seeds-'+(night?'nocturne':'daylight')+'.png';a.href=cvs.toDataURL('image/png');a.click();status('Plate saved as PNG')}
document.getElementById('light').onclick=toggleNight;document.getElementById('bloom').onclick=toggleBloom;
document.getElementById('still').onclick=()=>{frozen=!frozen;document.getElementById('still').textContent=frozen?'RESUME':'FREEZE';status(frozen?'Motion frozen':'Motion resumed');invalid=true};
document.getElementById('save').onclick=save;document.getElementById('prev').onclick=()=>changeActive(active-1);document.getElementById('next').onclick=()=>changeActive(active+1);
cvs.addEventListener('pointermove',ev=>{if(mobile)return;const p=layout;let ii=Math.floor((ev.clientX-(p.x+p.w*.035))/(p.w*.31));let next=(ev.clientX>=p.x&&ev.clientX<=p.x+p.w&&ev.clientY>=p.y&&ev.clientY<=p.y+p.h)?clamp(ii,0,2):-1;if(next!==pointer){pointer=next;invalid=true}});
cvs.addEventListener('pointerleave',()=>{pointer=-1;invalid=true});
cvs.addEventListener('pointerdown',ev=>{if(!mobile&&pointer>=0)changeActive(pointer);else if(mobile)changeActive(active+1)});
window.addEventListener('keydown',ev=>{if(ev.key==='1'||ev.key==='2'||ev.key==='3')changeActive(+ev.key-1);if(ev.code==='Space'){ev.preventDefault();document.getElementById('still').click()}if(ev.key==='ArrowRight'&&mobile)changeActive(active+1);if(ev.key==='ArrowLeft'&&mobile)changeActive(active-1)});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');if(reduced.matches){frozen=true;document.getElementById('still').textContent='RESUME'}
window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
})();
</script>
