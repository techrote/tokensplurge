<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#230526"><title>MOUTHFEEL — an uncooperative organism</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#230526;color:#edff52;font-family:Arial,Helvetica,sans-serif}button{font:inherit}#stage{position:absolute;inset:0;touch-action:none;overflow:hidden;background:repeating-linear-gradient(112deg,transparent 0 77px,#fa69cf18 77px 78px),#230526}canvas{position:absolute;inset:0;width:100%;height:100%}.fallback{position:absolute;width:75vmin;height:55vmin;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-25deg);border-radius:25% 70% 38% 65%;background:repeating-radial-gradient(ellipse at 30% 45%,#edff52 0 7px,#fa69cf 8px 15px,#181923 16px 24px);box-shadow:8vmin 4vmin 0 #4c34ff;transition:filter .3s,border-radius .6s;animation:squirm 6s ease-in-out infinite alternate}#stage:hover .fallback{filter:hue-rotate(100deg);border-radius:70% 20% 65% 35%}@keyframes squirm{to{transform:translate(-50%,-50%) rotate(18deg) scale(.9,1.2)}}
header{position:fixed;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;gap:20px;z-index:3;pointer-events:none;font:11px/1.5 monospace;letter-spacing:1.2px;text-transform:uppercase}.tag{background:#edff52;color:#230526;padding:5px 8px;height:max-content;transform:rotate(-3deg)}.serial{text-align:right;color:#fff0e4}h1{position:fixed;left:3vw;top:10vh;margin:0;font-size:clamp(70px,14vw,220px);font-weight:900;line-height:.73;letter-spacing:-.09em;transform:rotate(-9deg);mix-blend-mode:difference;color:#dfff53;pointer-events:none;z-index:1}.aside{position:fixed;right:22px;bottom:105px;z-index:2;writing-mode:vertical-rl;font:10px monospace;letter-spacing:3px;color:#fff0e4;pointer-events:none}.bottom{position:fixed;bottom:20px;left:24px;right:24px;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.caption{font:10px/1.7 monospace;letter-spacing:1px;color:#fff0e4;pointer-events:none}.caption strong{font-weight:400;color:#edff52}.controls{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid #edff52;background:#230526dd;color:#edff52;border-radius:0;cursor:pointer;padding:12px 14px;font:11px monospace;text-transform:uppercase;box-shadow:3px 3px 0 #fa69cf;transition:transform .15s}button:hover{background:#edff52;color:#230526;transform:translate(-2px,-2px)}button:focus-visible{outline:3px solid #fff;outline-offset:5px}button[aria-pressed=true]{background:#edff52;color:#230526}#announce{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.cursor-note{position:fixed;left:24px;top:51%;font:10px/1.6 monospace;letter-spacing:1px;writing-mode:vertical-rl;pointer-events:none;z-index:2;color:#fff0e4}
@media(max-width:600px){header{left:14px;right:14px;top:14px;font-size:9px}.serial{max-width:130px}h1{top:15%;font-size:23vw}.bottom{left:14px;right:14px;bottom:17px;display:block}.caption{font-size:9px;margin-bottom:12px;max-width:80%}.controls{justify-content:flex-start}button{padding:11px;font-size:10px}.aside{right:10px;bottom:160px;font-size:8px}.cursor-note{left:10px;font-size:8px;top:48%}}
@media(prefers-reduced-motion:reduce){.fallback{animation:none}button{transition:none}}
</style>
</head>
<body>
<main id="stage" aria-label="Mouthfeel, an interactive abstract organism. Move to attract it, hold and drag to stretch it, click to plant an eye. Space mutates the organism; P pauses motion."><div class="fallback" aria-hidden="true"></div><canvas id="organism" aria-hidden="true"></canvas></main>
<header><div class="tag">NO. 002 / Unnatural history</div><div class="serial">A specimen of excessive feeling<br>Nothing useful will happen here</div></header>
<h1 aria-label="Mouthfeel">MOUTH<br>FEEL<span style="font-size:.35em;vertical-align:top">™</span></h1>
<div class="cursor-note">MOVE CLOSER / IT HAS TERRIBLE MANNERS</div>
<div class="aside">PLEASE DO NOT FEED THE FEELING</div>
<div class="bottom"><div class="caption"><strong id="status">SPECIMEN 001 · EMOTIONALLY UNSTABLE</strong><br>DRAG TO STRETCH · CLICK TO PLANT AN EYE</div><nav class="controls" aria-label="Artwork controls"><button id="mutate" type="button">Mutate ↗</button><button id="still" type="button" aria-pressed="false">Pause</button><button id="save" type="button">Collect PNG ↓</button></nav></div>
<div id="announce" role="status" aria-live="polite"></div>
</body>
</html>
