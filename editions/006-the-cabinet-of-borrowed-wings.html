document.getElementById('pause').addEventListener('click',still);
document.getElementById('save').addEventListener('click',()=>{draw();const a=document.createElement('a');a.download='cabinet-of-borrowed-wings-plate-'+(S.mode+1)+'.png';a.href=cvs.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();document.getElementById('announce').textContent='PNG plate exported'});
cvs.addEventListener('pointermove',e=>{const r=cvs.getBoundingClientRect();S.px=clamp((e.clientX-r.left)/r.width,0,1);if(S.paused){S.light=S.px;draw()}});
document.addEventListener('keydown',e=>{if(e.target.matches('button,input'))return;const n=Number(e.key);if(n>=1&&n<=3)mode(n-1);else if(e.code==='Space'){e.preventDefault();still()}else if(e.key.toLowerCase()==='x'){document.getElementById('labels').click()}else if(e.key.toLowerCase()==='e'){document.getElementById('save').click()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){S.last=0;schedule()}});
new ResizeObserver(resize).observe(cvs);document.getElementById('pause').setAttribute('aria-pressed',String(S.paused));if(S.paused)document.getElementById('pause').textContent='Awaken';resize();schedule();
})();
</script></body></html>
